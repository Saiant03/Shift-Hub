<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Shift Hub"><meta name="theme-color" content="#0A0611">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json">
<style>html,body{height:100%;margin:0;background:#0A0611}img{max-width:100%}[hidden]{display:none!important}
body.pwa{padding:0!important;display:block!important;background:#0A0611}
body.pwa .tagline{display:none!important}
body.pwa .device{border-radius:0!important;padding:0!important;width:100vw!important;height:100dvh!important;box-shadow:none!important;background:#000}
body.pwa .phone{border-radius:0!important}</style></head><body class="pwa"><title>Shift Hub</title>
<style>
  :root{ --page-bg:#e7e3ef; --page-fg:#1a1526; --bezel:#0a0710; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; } }
  :root[data-theme="dark"]{ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(130% 90% at 50% -10%, color-mix(in srgb,var(--page-bg) 78%, #7A5AA0 22%), var(--page-bg) 62%);color:var(--page-fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;min-height:100%}
  .tagline{font-size:12.5px;color:color-mix(in srgb,var(--page-fg) 55%, transparent);text-align:center;max-width:400px;line-height:1.55}
  .tagline b{color:var(--page-fg);font-weight:600}

  .device{width:390px;max-width:100%;height:min(844px, calc(100dvh - 88px));background:var(--bezel);border-radius:52px;padding:11px;box-shadow:0 40px 90px -34px rgba(60,30,90,.7),0 0 0 2px rgba(255,255,255,.04) inset}

  .phone{position:relative;height:100%;width:100%;border-radius:42px;overflow:hidden;isolation:isolate;
    --bg:#F4F1F9;--bg-wash:radial-gradient(120% 70% at 50% 0%, #ECE6F6 0%, #F4F1F9 55%);
    --text:#1C1626;--text2:#7A7190;--text3:#9A93AC;
    --card:rgba(255,255,255,.62);--card2:rgba(255,255,255,.82);--card-border:rgba(255,255,255,.75);
    --divider:rgba(40,20,60,.09);--fill:rgba(122,90,160,.10);--fill2:rgba(122,90,160,.16);
    --tabbar:rgba(255,255,255,.55);--tab-border:rgba(255,255,255,.65);--hole:#F1ECF8;
    --accent:#7A5AA0;--accent-strong:#6D4E8C;--accent-soft:rgba(122,90,160,.14);
    --gold:#B98F3E;--red:#D6584F;--glass-blur:22px;
    background:var(--bg);color:var(--text);font-size:14px;transition:background .3s ease,color .3s ease}
  .phone[data-appearance="dark"]{--bg:#000;--bg-wash:radial-gradient(120% 75% at 50% 0%, #1A0F26 0%, #0A0611 45%, #000 78%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;
    --card:rgba(38,28,52,.52);--card2:rgba(46,34,62,.72);--card-border:rgba(180,150,220,.14);
    --divider:rgba(200,180,230,.10);--fill:rgba(160,130,210,.14);--fill2:rgba(160,130,210,.22);
    --tabbar:rgba(30,20,44,.5);--tab-border:rgba(190,160,230,.16);--hole:#160D20;
    --accent:#9B7FC7;--accent-strong:#B49BDA;--accent-soft:rgba(155,127,199,.2);--gold:#D8B25A;--red:#F0776E}
  @media (prefers-color-scheme: dark){ .phone[data-appearance="auto"]{--bg:#000;--bg-wash:radial-gradient(120% 75% at 50% 0%, #1A0F26 0%, #0A0611 45%, #000 78%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;--card:rgba(38,28,52,.52);--card2:rgba(46,34,62,.72);--card-border:rgba(180,150,220,.14);
    --divider:rgba(200,180,230,.10);--fill:rgba(160,130,210,.14);--fill2:rgba(160,130,210,.22);
    --tabbar:rgba(30,20,44,.5);--tab-border:rgba(190,160,230,.16);--hole:#160D20;--accent:#9B7FC7;--accent-strong:#B49BDA;--accent-soft:rgba(155,127,199,.2);--gold:#D8B25A;--red:#F0776E}}

  .bgwash{position:absolute;inset:0;background:var(--bg-wash);z-index:0;pointer-events:none;transition:background .3s ease}

  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 110px;z-index:1;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{width:0}
  /* Calendar fills the screen: grid grows to use all vertical space */
  .screen.cal{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .screen.cal .grid{flex:1;min-height:0;grid-auto-rows:1fr;gap:5px}
  .screen.cal .cell{height:auto}
  .screen.cal .cell .circ{width:100%;height:100%;border-radius:13px;font-size:17px}
  .screen.cal .cell.sel .circ::after{inset:0;border-radius:13px}
  .daybar{flex:0 0 auto}

  h1.big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
  .eyebrow{font-size:12px;font-weight:700;color:var(--accent);margin:0;letter-spacing:.3px}
  .sec{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px}
  .muted{color:var(--text2)}.muted3{color:var(--text3)}
  .row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.sp{flex:1}
  .num{font-variant-numeric:tabular-nums}

  .card{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:22px;backdrop-filter:blur(var(--glass-blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.7);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 10px 30px -18px rgba(30,10,50,.5)}
  .r14{border-radius:14px}
  .divider{height:1px;background:var(--divider);border:0;margin:0}
  .tile{border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
  .tile svg{width:52%;height:52%}
  .statcol{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .statcol .v{font-size:20px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .statcol .l{font-size:11.5px;color:var(--text2)}
  .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .press{transition:transform .12s ease}.press:active{transform:scale(.95)}
  button:focus-visible,[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

  .hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(150deg,#6D4E8C,#3B2456 78%);border:1px solid rgba(255,255,255,.14)}
  .hero::after{content:"";position:absolute;top:-40%;right:-10%;width:70%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
  .hero .k{font-size:12px;font-weight:600;color:rgba(233,224,247,.85);letter-spacing:.3px}
  .hero .v{font-size:38px;font-weight:800;letter-spacing:-1px;margin:6px 0 3px;font-variant-numeric:tabular-nums}
  .hero .s{font-size:12.5px;color:rgba(255,255,255,.72)}

  .brk{display:flex;align-items:center;gap:12px;padding:13px 15px}
  .brk .bd{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brk .bd svg{width:16px;height:16px;color:#fff}
  .brk .nm{font-size:14px;font-weight:600}.brk .sub{font-size:11.5px;color:var(--text2)}
  .brk .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .compbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--fill)}
  .compbar i{height:100%;display:block}

  /* Calendar */
  .navbtn{width:34px;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .navbtn svg{width:16px;height:16px}
  .editbtn{padding:8px 15px;border-radius:11px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
  .editbtn.on{color:#fff;background:var(--accent)}
  .brushbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .brushbar::-webkit-scrollbar{display:none}
  .brush{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);font-size:13px;font-weight:600;transition:.15s}
  .brush.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
  .brush .sw{width:14px;height:14px;border-radius:5px}
  .weekhdr,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .weekhdr span{text-align:center;font-size:11px;font-weight:700;color:var(--text3)}
  .weekhdr span.we{color:var(--accent)}
  .cell{height:46px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
  .cell .circ{width:37px;height:37px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;transition:transform .18s cubic-bezier(.3,1.3,.5,1),background .15s}
  .cell.work .circ{color:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
  .cell.today .circ{outline:2px solid var(--accent);outline-offset:2px}
  .cell.sel .circ{transform:scale(1.06)}
  .cell.sel .circ::after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2.5px solid var(--accent)}
  .cell.dim{opacity:.32}
  .cell.pp .circ{transform:scale(.85)}
  .cell .ot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:2px;background:var(--gold);z-index:2}
  .cell .hol{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red);z-index:2}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600}
  .mix{display:flex;flex-wrap:wrap;gap:8px}
  .mixchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:var(--fill);font-size:12.5px;font-weight:600}
  .mixchip .ct{color:var(--text2)}

  .listrow{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left;transition:background .16s}
  .listrow:active{background:var(--fill)}
  .toggle{width:50px;height:30px;border-radius:15px;background:var(--fill2);position:relative;transition:.2s;flex:0 0 auto}
  .toggle.on{background:var(--accent)}
  .toggle i{position:absolute;top:2.5px;left:2.5px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
  .toggle.on i{transform:translateX(20px)}
  .field{display:flex;align-items:center;gap:10px;padding:6px 14px}
  .field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 0;outline:none;font-family:inherit}
  .field .cur{font-size:14px;font-weight:600;color:var(--text2)}
  .tinput{width:100%;background:var(--fill);border:1px solid var(--card-border);border-radius:11px;color:var(--text);font-size:15px;padding:12px 14px;outline:none;font-family:inherit}
  .tinput:focus{border-color:var(--accent)}

  .tabbar{position:absolute;left:20px;right:20px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;z-index:7;display:flex;gap:4px;padding:0 8px;align-items:center;background:var(--tabbar);border:1px solid var(--tab-border);border-radius:33px;backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 20px 40px -18px rgba(30,10,50,.5)}
  .tabbtn{position:relative;flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text2);z-index:1;transition:color .2s}
  .tabbtn svg{width:20px;height:20px}.tabbtn span{font-size:9.5px;font-weight:500}
  .tabbtn.on{color:#fff}.tabbtn.on span{font-weight:600}
  .tabhi{position:absolute;top:7px;height:52px;border-radius:26px;background:var(--accent);box-shadow:0 6px 16px -5px var(--accent);z-index:0;transition:transform .34s cubic-bezier(.3,1.1,.35,1),width .34s cubic-bezier(.3,1.1,.35,1)}

  .backdrop{position:absolute;inset:0;z-index:20;background:rgba(10,5,20,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);pointer-events:none;transition:background .3s ease,backdrop-filter .3s ease}
  .backdrop.show{background:rgba(10,5,20,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card2);border-radius:26px 26px 0 0;border-top:1px solid var(--card-border);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:93%;overflow-y:auto;transform:translateY(103%);box-shadow:0 -12px 44px rgba(20,8,40,.4)}
  .sheet.show{animation:sheetIn .42s cubic-bezier(.2,1,.32,1) forwards}
  .sheet.hide{animation:sheetOut .26s ease forwards}
  @keyframes sheetIn{from{transform:translateY(103%)}to{transform:translateY(0)}}
  @keyframes sheetOut{from{transform:translateY(0)}to{transform:translateY(103%)}}
  .sheet::-webkit-scrollbar{width:0}
  .sheet .inner{opacity:0;transform:scale(.96);animation:innerIn .4s .06s cubic-bezier(.2,1,.32,1) forwards}
  @keyframes innerIn{to{opacity:1;transform:scale(1)}}
  .handle{width:38px;height:5px;border-radius:3px;background:var(--divider);margin:8px auto 16px}
  .sheethdr{display:flex;align-items:center;margin-bottom:16px}
  .sheethdr .t{font-size:16px;font-weight:700;flex:1;text-align:center}
  .link{color:var(--accent);font-size:16px;font-weight:500}.link.b{font-weight:700}
  .optrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;transition:background .18s}
  .optrow.on{background:var(--accent-soft)}
  .check{color:var(--accent);display:flex}.check svg{width:18px;height:18px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:30px;height:30px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .stepper button:active{transform:scale(.88)}.stepper button svg{width:12px;height:12px}
  .stepper .sv{min-width:58px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

  /* Color picker */
  .cpick{padding:14px;display:flex;flex-direction:column;gap:12px}
  .sv{position:relative;width:100%;height:150px;border-radius:12px;cursor:crosshair;touch-action:none;border:1px solid var(--card-border)}
  .sv-th{position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .hue{position:relative;width:100%;height:16px;border-radius:8px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .hue-th{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .cprow{display:flex;align-items:center;gap:10px}
  .cprev{width:38px;height:38px;border-radius:10px;flex:0 0 auto;border:1px solid var(--card-border)}
  .hexin{flex:1;background:var(--fill);border:1px solid var(--card-border);border-radius:10px;color:var(--text);font-size:15px;font-weight:600;padding:11px 12px;outline:none;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .pcol{width:28px;height:28px;border-radius:8px;position:relative}
  .pcol.on::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2px solid var(--accent)}
  .iconrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .icb{width:42px;height:42px;border-radius:11px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text2)}
  .icb svg{width:20px;height:20px}
  .icb.on{background:var(--accent);color:#fff}
  .delbtn{width:100%;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);font-weight:600;font-size:15px;margin-top:14px;transition:transform .12s}
  .delbtn:active{transform:scale(.98)}

  .preview{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden}
  .preview::after{content:"";position:absolute;top:-30%;right:-10%;width:60%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 60%)}
  .preview .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:1}
  .preview .hd .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
  .preview .hd .ic svg{width:19px;height:19px}
  .preview .stats{display:flex;gap:8px;position:relative;z-index:1}
  .preview .stats .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .preview .stats .l{font-size:11.5px;color:rgba(255,255,255,.78)}

  .csvbox{background:var(--card);border:1px solid var(--card-border);border-radius:14px;max-height:230px;overflow:auto;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text2);white-space:pre;line-height:1.7}
  .bigbtn{width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;transition:transform .12s}
  .bigbtn:active{transform:scale(.98)}.bigbtn svg{width:18px;height:18px}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);z-index:30;background:var(--accent-strong);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px -10px rgba(40,10,60,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ===== v7 polish: motion tokens + iOS refinements ===== */
  .phone{--e-spring:cubic-bezier(.34,1.32,.42,1);--e-out:cubic-bezier(.2,.9,.3,1)}
  .sec{margin-left:4px}
  .handle{width:40px;height:5px;margin:7px auto 14px}
  .sheethdr{padding-bottom:14px;border-bottom:1px solid var(--divider);margin-bottom:16px}
  /* iOS segmented stepper */
  .stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:11px;padding:3px;height:38px;flex:0 0 auto}
  .stepper button{width:36px;height:32px;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .stepper button:active{transform:scale(.88);background:var(--fill2)}
  .stepper .sv{min-width:58px;height:32px;display:flex;align-items:center;justify-content:center;text-align:center}
  .stepper .sv b{font-weight:700;animation:valpop .24s var(--e-spring)}
  @keyframes valpop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
  /* Calendar cell refinement */
  .screen.cal .grid{position:relative}
  .screen.cal .cell .circ{overflow:hidden}
  .screen.cal .cell .circ .dn{position:relative;z-index:2;font-variant-numeric:tabular-nums}
  .screen.cal .cell.sel .circ::after{display:none}
  .screen.cal .cell.work .circ::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 44%,rgba(0,0,0,.15));pointer-events:none;z-index:1}
  .screen.cal .cell.work .circ{box-shadow:0 5px 14px -6px rgba(0,0,0,.5)}
  .screen.cal .cell.wknd:not(.work) .circ{background:color-mix(in srgb,var(--accent) 9%, var(--fill))}
  .calsel{position:absolute;top:0;left:0;border:2.5px solid var(--accent);border-radius:15px;pointer-events:none;z-index:4;box-shadow:0 0 0 4px var(--accent-soft),0 10px 22px -8px var(--accent)}
  /* Month slide */
  @keyframes gridInR{from{opacity:.25;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes gridInL{from{opacity:.25;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ===== State ===== */

/* ===== Date helpers (local, no UTC drift) ===== */
function pad(n){return String(n).padStart(2,'0');}
function isoOf(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function weekdayMon(y,m,d){return (new Date(y,m,d).getDay()+6)%7;} // 0=Mon..6=Sun
function isWeekend(y,m,d){const w=new Date(y,m,d).getDay();return w===0||w===6;}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ===== RO public holidays (any year) ===== */
const holidayCache={};
function isoUTC(dt){return dt.getUTCFullYear()+'-'+pad(dt.getUTCMonth()+1)+'-'+pad(dt.getUTCDate());}
function orthodoxEaster(year){
  const a=year%4,b=year%7,c=year%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  const month=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;
  const jd=new Date(Date.UTC(year,month-1,day)); jd.setUTCDate(jd.getUTCDate()+13); return jd;
}
function addUTC(dt,n){const x=new Date(dt);x.setUTCDate(x.getUTCDate()+n);return x;}
function holidaysFor(year){
  if(holidayCache[year]) return holidayCache[year];
  const s=new Set([`${year}-01-01`,`${year}-01-02`,`${year}-01-06`,`${year}-01-07`,`${year}-01-24`,
    `${year}-05-01`,`${year}-06-01`,`${year}-08-15`,`${year}-11-30`,`${year}-12-01`,`${year}-12-25`,`${year}-12-26`]);
  const e=orthodoxEaster(year);
  [ -2, 0, 1, 49, 50 ].forEach(off=>s.add(isoUTC(addUTC(e,off))));
  holidayCache[year]=s; return s;
}
function isROHoliday(y,m,d){ return holidaysFor(y).has(isoOf(y,m,d)); }
function isHolISO(iso){ const [y]=iso.split('-').map(Number); const meta=state.dayMeta[iso]; return (meta&&meta.holiday) || holidaysFor(y).has(iso); }

/* ===== Shift helpers ===== */
function shiftById(id){ return state.shifts.find(s=>s.id===id) || null; }
function duration(s){const d=s.end-s.start;return d<=0?d+1440:d;}
function paidMinutes(s){return Math.max(0,duration(s)-s.brk);}
function paidHours(s){return paidMinutes(s)/60;}
function timeStr(min){const h=Math.floor(min/60)%24,m=((min%60)+60)%60;return pad(h)+':'+pad(m);}
function timeRange(s){return timeStr(s.start)+'–'+timeStr(s.end);}
function hmLabel(min){const h=Math.floor(min/60),m=min%60;return m===0?h+' h':h+' h '+m+'m';}
function assignedShift(iso){ const id=state.assignments[iso]; return id?shiftById(id):null; }
function metaOf(iso){ return state.dayMeta[iso]||{otDay:0,otNight:0,holiday:false}; }

/* ===== Salary engine (month-scoped) =====
   Base daily rate = net / working days of the month (Mon–Fri minus RO holidays).
   Fixed reference, so bonuses stay stable regardless of how many days are worked. */
const STD_DAY_HOURS=8;
function monthISOs(y,m){ const n=new Date(y,m+1,0).getDate(); const out=[]; for(let d=1;d<=n;d++) out.push({iso:isoOf(y,m,d),y,m,d}); return out; }
function workingDaysInMonth(y,m){ let c=0; const n=new Date(y,m+1,0).getDate();
  for(let d=1;d<=n;d++){ const w=new Date(y,m,d).getDay(); if(w!==0&&w!==6 && !isROHoliday(y,m,d)) c++; } return c; }
function baseHourly(y,m){ const wd=workingDaysInMonth(y,m); return wd>0 ? state.netMonthly/(wd*STD_DAY_HOURS) : 0; }
function dayBreakdown(x, bh){
  const s=assignedShift(x.iso); if(!s) return null;
  const reg=paidHours(s), base=bh*reg;   // 8h shift -> net / workingDays
  const we=isWeekend(x.y,x.m,x.d), ho=isHolISO(x.iso), m=metaOf(x.iso);
  const night = s.night ? 0.25*base : 0;
  const weekend = we ? 0.10*base : 0;
  const holiday = ho ? 1.00*base : 0;
  const otDay = bh*(1+0.75+(we?0.10:0)+(ho?1:0))*m.otDay;
  const otNight = bh*(1+0.75+0.25+(we?0.10:0)+(ho?1:0))*m.otNight;
  return {s,base,night,weekend,holiday,otDay,otNight,reg,we,ho,otD:m.otDay,otN:m.otNight,
          total:base+night+weekend+holiday+otDay+otNight};
}
function monthTotals(y,m){
  const bh=baseHourly(y,m);
  const t={base:0,night:0,weekend:0,holiday:0,otDay:0,otNight:0,days:0,paidH:0,nightH:0,otDayH:0,otNightH:0};
  for(const x of monthISOs(y,m)){ const b=dayBreakdown(x,bh); if(!b) continue;
    t.base+=b.base;t.night+=b.night;t.weekend+=b.weekend;t.holiday+=b.holiday;t.otDay+=b.otDay;t.otNight+=b.otNight;
    t.days++;t.paidH+=b.reg; if(b.s.night)t.nightH+=b.reg; t.otDayH+=b.otD;t.otNightH+=b.otN;
  }
  t.otTotal=t.otDay+t.otNight; t.bonusTotal=t.night+t.weekend+t.holiday+t.otTotal; t.grand=t.base+t.bonusTotal;
  return t;
}
function shiftMix(y,m){ const c={}; for(const x of monthISOs(y,m)){const s=assignedShift(x.iso); if(s)c[s.id]=(c[s.id]||0)+1;} return c; }
function csvExport(y,m){
  const bh=baseHourly(y,m);
  const lines=['Day,Shift,Paid h,OT day,OT night,Weekend,Holiday,Pay (RON)'];
  for(const x of monthISOs(y,m)){ const s=assignedShift(x.iso),b=dayBreakdown(x,bh),mm=metaOf(x.iso);
    lines.push([x.d, s?s.name:'Off', s?paidHours(s).toFixed(1):0, mm.otDay, mm.otNight,
      isWeekend(x.y,x.m,x.d)?'yes':'no', isHolISO(x.iso)?'yes':'no', b?Math.round(b.total):0].join(','));
  }
  return lines.join('\n');
}
function fmtN(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');}

/* ===== Color helpers (HSV) ===== */
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),mm=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[Math.round((r+mm)*255),Math.round((g+mm)*255),Math.round((b+mm)*255)];}
function hex2(v){return v.toString(16).padStart(2,'0');}
function hsvToHex(h,s,v){const[r,g,b]=hsvToRgb(h,s,v);return('#'+hex2(r)+hex2(g)+hex2(b)).toUpperCase();}
function hexToHsv(hex){hex=(hex||'').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex))return null;
  const r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return{h,s:mx?d/mx:0,v:mx};}
function draftColor(){return hsvToHex(state.pk.h,state.pk.s,state.pk.v);}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ===== HUB ===== */

    <div class="amt" style="color:${r[4]>0?'var(--text)':'var(--text3)'}">${fmtN(r[4])}</div></div>${i<rows.length-1?'<hr class="divider">':''}`).join('');
  return `

  </div>
  <div class="hero" style="margin-bottom:14px">
    <div class="k">Estimated net pay this month</div>
    <div class="v">${fmtN(t.grand)}<span style="font-size:16px;font-weight:600;opacity:.7"> RON</span></div>
    <div class="s">${t.days} day${t.days===1?'':'s'} · ${t.paidH.toFixed(0)} h paid · base ${fmtN(t.base)} + bonuses ${fmtN(t.bonusTotal)}</div>

/* ===== Calendar ===== */
function calendarCells(){
  const y=state.viewY,m=state.viewM;
  const first=weekdayMon(y,m,1);
  const dim=new Date(y,m+1,0).getDate();
  const prevDim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=first-1;i>=0;i--){ const d=prevDim-i; const pm=m===0?11:m-1, py=m===0?y-1:y; cells.push({y:py,m:pm,d,iso:isoOf(py,pm,d),dim:true}); }
  for(let d=1;d<=dim;d++) cells.push({y,m,d,iso:isoOf(y,m,d),dim:false});
  let nd=1; while(cells.length%7!==0 || cells.length<42){ const nm=m===11?0:m+1, ny=m===11?y+1:y; cells.push({y:ny,m:nm,d:nd,iso:isoOf(ny,nm,nd),dim:true}); nd++; if(cells.length>=42)break; }
  return cells;
}

function renderScreen(animate){const el=document.getElementById('screen');const top=el.scrollTop;el.classList.toggle('cal',state.tab==='calendar');el.innerHTML=screenHTML();if(state.tab!=='calendar')el.scrollTop=top;
  if(state.tab==='calendar') requestAnimationFrame(placeSelRing);

function placeSelRing(){
  const grid=document.getElementById('calgrid'); if(!grid) return;
  const cell=grid.querySelector(`.cell[data-iso="${state.selISO}"]`);
  let ring=grid.querySelector('.calsel');
  if(!cell){ if(ring) ring.remove(); ringPrev=null; return; }
  // offset* is relative to the offsetParent (#calgrid, position:relative) and is
  // NOT affected by CSS transforms (e.g. the screen entrance scale), so the ring
  // aligns correctly even while an entrance animation is mid-flight.
  const x=cell.offsetLeft, y=cell.offsetTop, w=cell.offsetWidth, h=cell.offsetHeight;
  if(!ring){ ring=document.createElement('div'); ring.className='calsel'; grid.appendChild(ring); }
  ring.style.width=w+'px'; ring.style.height=h+'px'; ring.style.transform=`translate(${x}px,${y}px)`;
  if(ringPrev && !reduce && (ringPrev.x!==x||ringPrev.y!==y)){
    ring.animate([{transform:`translate(${ringPrev.x}px,${ringPrev.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:360,easing:getComputedStyle(document.querySelector('.phone')).getPropertyValue('--e-spring')||'ease'});
  }
  ringPrev={x,y};
}

/* ===== Color picker interactions ===== */
function updatePickerUI(){
  const col=draftColor();
  const sv=document.getElementById('cpsv'),svT=document.getElementById('cpsvT'),hueT=document.getElementById('cphueT'),prev=document.getElementById('cprev'),hex=document.getElementById('cphex');
  if(!sv)return;
  sv.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(state.pk.h,1,1)})`;
  svT.style.left=(state.pk.s*100)+'%';svT.style.top=((1-state.pk.v)*100)+'%';
  hueT.style.left=(state.pk.h/360*100)+'%';
  prev.style.background=col; if(document.activeElement!==hex) hex.value=col;
  const sp=document.querySelector('.preview'); if(sp)sp.style.background=col;
  document.querySelectorAll('.pcol').forEach(p=>p.classList.toggle('on', (p.getAttribute('data-action')||'').split(':')[1]?.toLowerCase()===col.toLowerCase()));
}
function attachPicker(){
  const sv=document.getElementById('cpsv'),hue=document.getElementById('cphue'),hex=document.getElementById('cphex');
  if(!sv)return;
  const svMove=e=>{const r=sv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    x=Math.max(0,Math.min(1,x));y=Math.max(0,Math.min(1,y));state.pk.s=x;state.pk.v=1-y;updatePickerUI();};
  const hueMove=e=>{const r=hue.getBoundingClientRect();let x=(e.clientX-r.left)/r.width;x=Math.max(0,Math.min(1,x));state.pk.h=x*360;updatePickerUI();};
  bindDrag(sv,svMove); bindDrag(hue,hueMove);
  hex.addEventListener('input',()=>{const hv=hexToHsv(hex.value.trim());if(hv){state.pk=hv;updatePickerUI();}});
}
function bindDrag(el,move){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);move(e);e.preventDefault();
    const mv=ev=>move(ev),up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);});
}

/* ===== Paint ===== */
let painting=false;
function applyBrush(cell){const iso=cell.getAttribute('data-iso');if(!iso)return;
  if(state.brush==='off')delete state.assignments[iso];else state.assignments[iso]=state.brush;
  paintCellVisual(cell,iso);
  state.selISO=iso; moveRing(cell);}  // selection ring follows the cell being painted
function paintCellVisual(cell,iso){const s=assignedShift(iso);const circ=cell.querySelector('.circ');const hol=isHolISO(iso);
  if(s){cell.classList.add('work');circ.style.background=s.color;circ.style.color='#fff';}
  else{cell.classList.remove('work');circ.style.background='var(--fill)';circ.style.color=hol?'var(--red)':'var(--text2)';}}
function moveRing(cell){ // instant reposition (no spring) so the ring tracks the finger while painting
  const grid=document.getElementById('calgrid'); if(!grid) return;
  let ring=grid.querySelector('.calsel');
  if(!ring){ ring=document.createElement('div'); ring.className='calsel'; grid.appendChild(ring); }
  const x=cell.offsetLeft,y=cell.offsetTop;
  ring.style.width=cell.offsetWidth+'px'; ring.style.height=cell.offsetHeight+'px'; ring.style.transform=`translate(${x}px,${y}px)`;
  ringPrev={x,y};}
function afterPaint(){saveState();renderScreen();}

/* ===== Sheets openers ===== */
function openDayMeta(){const m=metaOf(state.selISO);state.draftOtDay=m.otDay;state.draftOtNight=m.otNight;state.draftHoliday=!!(state.dayMeta[state.selISO]&&state.dayMeta[state.selISO].holiday);state.sheet='meta';renderSheet();}
function saveMeta(){const iso=state.selISO;const has=state.draftOtDay>0||state.draftOtNight>0||state.draftHoliday;
  if(has)state.dayMeta[iso]={otDay:state.draftOtDay,otNight:state.draftOtNight,holiday:state.draftHoliday};else delete state.dayMeta[iso];
  saveState();closeSheet();renderScreen();toast('Day saved');}
function openShift(id){const s=shiftById(id);state.editingId=id;state.isNew=false;state.d={name:s.name,start:s.start,end:s.end,brk:s.brk,color:s.color,icon:s.icon,night:s.night};
  state.pk=hexToHsv(s.color)||{h:0,s:0,v:.6};state.sheet='shift';renderSheet();}
function openNewShift(){state.editingId=null;state.isNew=true;state.d={name:'',start:540,end:1020,brk:60,color:'#7A5AA0',icon:'briefcase',night:false};
  state.pk=hexToHsv('#7A5AA0');state.sheet='shift';renderSheet();}
function saveShift(){const nameEl=document.getElementById('shname');if(nameEl)state.d.name=nameEl.value.trim();
  state.d.color=draftColor(); if(!state.d.name)state.d.name='Shift';
  if(state.isNew){const id='c'+Date.now();state.shifts.push({id,...state.d});}
  else{const s=shiftById(state.editingId);Object.assign(s,state.d);}
  saveState();closeSheet();renderScreen();toast(state.isNew?'Shift created':'Shift updated');}
function deleteShift(){const id=state.editingId;state.shifts=state.shifts.filter(s=>s.id!==id);
  Object.keys(state.assignments).forEach(iso=>{if(state.assignments[iso]===id)delete state.assignments[iso];});
  if(state.brush===id)state.brush='off';
  saveState();closeSheet();renderScreen();toast('Shift deleted');}
function closeSheet(){const sh=document.getElementById('sheet'),bd=document.getElementById('backdrop');
  if(state.sheet&&!reduce){sh.classList.remove('show');sh.classList.add('hide');}else sh.classList.remove('show');
  bd.classList.remove('show');state.sheet=null;}
function changeMonth(delta){let m=state.viewM+delta,y=state.viewY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}state.viewM=m;state.viewY=y;
  const n=new Date(y,m+1,0).getDate();const [,,sd]=state.selISO.split('-').map(Number);state.selISO=isoOf(y,m,Math.min(sd,n));
  ringPrev=null; gridSlide=delta>0?'slideR':'slideL'; saveState(); renderScreen(); gridSlide='';}

/* ===== Events ===== */
document.addEventListener('input',e=>{if(e.target&&e.target.id==='netinput'){const v=parseInt(e.target.value||'0',10);state.netMonthly=isNaN(v)?0:v;saveState();}});

const screenEl=()=>document.getElementById('screen');
document.addEventListener('pointerdown',e=>{
  if(!state.editMode)return;const cell=e.target.closest?e.target.closest('.cell.paintable'):null;if(!cell)return;
  painting=true;state.selISO=cell.getAttribute('data-iso');applyBrush(cell);e.preventDefault();
},{passive:false});
document.addEventListener('pointermove',e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el&&el.closest?el.closest('.cell.paintable'):null;if(cell)applyBrush(cell);});
document.addEventListener('pointerup',()=>{if(painting){painting=false;afterPaint();}});

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const raw=btn.getAttribute('data-action');const ci=raw.indexOf(':');const cmd=ci<0?raw:raw.slice(0,ci),arg=ci<0?'':raw.slice(ci+1);
  switch(cmd){
    case 'tab': if(state.tab!==arg){ringPrev=null;state.tab=arg;renderTabbar();renderScreen(true);} break;
    case 'selday': if(!state.editMode){ selectDay(arg); } break;
    case 'toggleEdit': ringPrev=null;state.editMode=!state.editMode;renderScreen(); break;
    case 'brush': state.brush=arg;renderScreen(); break;
    case 'prevMonth': changeMonth(-1); break;
    case 'nextMonth': changeMonth(1); break;
    case 'dayMeta': openDayMeta(); break;
    case 'export': state.sheet='export';renderSheet(); break;
    case 'appear': state.appearance=arg;saveState();applyAppearance();renderScreen(); break;
    case 'notif': state.notifications=!state.notifications;renderScreen(); break;
    case 'sheetClose': closeSheet(); break;
    case 'addShift': openNewShift(); break;
    case 'editShift': openShift(arg); break;
    /* meta sheet */
    case 'otDayM': state.draftOtDay=Math.max(0,state.draftOtDay-1);renderSheetUpdate(); break;
    case 'otDayP': state.draftOtDay=Math.min(16,state.draftOtDay+1);renderSheetUpdate(); break;
    case 'otNightM': state.draftOtNight=Math.max(0,state.draftOtNight-1);renderSheetUpdate(); break;
    case 'otNightP': state.draftOtNight=Math.min(16,state.draftOtNight+1);renderSheetUpdate(); break;
    case 'holToggle': state.draftHoliday=!state.draftHoliday;renderSheetUpdate(); break;
    case 'metaSave': saveMeta(); break;
    /* shift sheet */
    case 'sM': state.d.start=(state.d.start-30+1440)%1440;refreshShiftSheet(); break;
    case 'sP': state.d.start=(state.d.start+30)%1440;refreshShiftSheet(); break;
    case 'eM': state.d.end=(state.d.end-30+1440)%1440;refreshShiftSheet(); break;
    case 'eP': state.d.end=(state.d.end+30)%1440;refreshShiftSheet(); break;
    case 'bM': state.d.brk=Math.max(0,state.d.brk-5);refreshShiftSheet(); break;
    case 'bP': state.d.brk=Math.min(180,state.d.brk+5);refreshShiftSheet(); break;
    case 'shNight': state.d.night=!state.d.night;refreshShiftSheet(); break;
    case 'shIcon': state.d.icon=arg;refreshShiftSheet(); break;
    case 'preset': state.pk=hexToHsv(arg);updatePickerUI(); break;
    case 'shiftSave': saveShift(); break;
    case 'shiftDelete': deleteShift(); break;
    /* export */
    case 'csvCopy': {const txt=csvExport(state.viewY,state.viewM);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('CSV copied')).catch(()=>toast('Copy blocked here'));else toast('Copy blocked here');} break;
  }
});
// Re-render the shift sheet but keep the name field value & focus
function refreshShiftSheet(){const nameEl=document.getElementById('shname');if(nameEl)state.d.name=nameEl.value;renderSheetUpdate();}
window.addEventListener('resize',()=>{moveTabHi();});

loadState();
renderAll(false);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){r.update&&r.update();}).catch(function(){});});}</script></body></html>
