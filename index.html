<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<style>html,body{height:100%;margin:0;background:#0F0F13}img{max-width:100%}[hidden]{display:none!important}
body.pwa{padding:0!important;display:block!important;background:#0F0F13}
body.pwa .tagline{display:none!important}
body.pwa .device{border-radius:0!important;padding:0!important;width:100vw!important;height:100dvh!important;box-shadow:none!important;background:#0F0F13}
body.pwa .phone{border-radius:0!important}</style></head><body class="pwa"><title>Shift Hub</title>
<style>
  :root{ --page-bg:#e7e3ef; --page-fg:#1a1526; --bezel:#0a0710; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; } }
  :root[data-theme="dark"]{ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(130% 90% at 50% -10%, color-mix(in srgb,var(--page-bg) 78%, #6366F1 22%), var(--page-bg) 62%);color:var(--page-fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;min-height:100%}
  .tagline{font-size:12.5px;color:color-mix(in srgb,var(--page-fg) 55%, transparent);text-align:center;max-width:400px;line-height:1.55}
  .tagline b{color:var(--page-fg);font-weight:600}

  .device{width:390px;max-width:100%;height:min(844px, calc(100dvh - 88px));background:var(--bezel);border-radius:52px;padding:11px;box-shadow:0 40px 90px -34px rgba(60,30,90,.7),0 0 0 2px rgba(255,255,255,.04) inset}

  .phone{position:relative;height:100%;width:100%;border-radius:42px;overflow:hidden;isolation:isolate;
    /* LIGHT — refined violet (shadcn-clean) */
    --bg:#F6F4FB;--bg-wash:radial-gradient(120% 70% at 50% 0%, #EEE9F8 0%, #F6F4FB 55%);
    --text:#17121F;--text2:#6E6785;--text3:#9A93AC;
    --card:rgba(255,255,255,.72);--card2:rgba(255,255,255,.86);--card-border:rgba(40,20,70,.10);
    --divider:rgba(40,20,70,.08);--fill:rgba(122,87,200,.09);--fill2:rgba(122,87,200,.15);
    --tabbar:rgba(255,255,255,.6);--tab-border:rgba(40,20,70,.08);--hole:#F1ECF8;--surface:#FFFFFF;
    --accent:#7A57C8;--accent-strong:#6A46BC;--accent-soft:rgba(122,87,200,.13);--ring:#7A57C8;
    --gold:#B98F3E;--red:#DC5A50;--glass-blur:22px;
    background:var(--bg);color:var(--text);font-size:14px;transition:background .3s ease,color .3s ease}
  .phone[data-appearance="dark"]{--bg:#0A0711;--bg-wash:radial-gradient(120% 78% at 50% 0%, #17102A 0%, #0B0713 46%, #060409 82%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;
    --card:rgba(24,18,34,.6);--card2:rgba(30,23,42,.75);--card-border:rgba(170,140,225,.13);
    --divider:rgba(200,180,235,.09);--fill:rgba(150,120,215,.14);--fill2:rgba(150,120,215,.22);
    --tabbar:rgba(22,16,32,.55);--tab-border:rgba(180,150,230,.16);--hole:#150E22;--surface:#161020;
    --accent:#8B6DE0;--accent-strong:#AB90F2;--accent-soft:rgba(139,109,224,.2);--ring:#8B6DE0;--gold:#D8B25A;--red:#F0776E}
  @media (prefers-color-scheme: dark){ .phone[data-appearance="auto"]{--bg:#0A0711;--bg-wash:radial-gradient(120% 78% at 50% 0%, #17102A 0%, #0B0713 46%, #060409 82%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;--card:rgba(24,18,34,.6);--card2:rgba(30,23,42,.75);--card-border:rgba(170,140,225,.13);
    --divider:rgba(200,180,235,.09);--fill:rgba(150,120,215,.14);--fill2:rgba(150,120,215,.22);
    --tabbar:rgba(22,16,32,.55);--tab-border:rgba(180,150,230,.16);--hole:#150E22;--surface:#161020;--accent:#8B6DE0;--accent-strong:#AB90F2;--accent-soft:rgba(139,109,224,.2);--ring:#8B6DE0;--gold:#D8B25A;--red:#F0776E}}

  .bgwash{position:absolute;inset:0;background:var(--bg-wash);z-index:0;pointer-events:none;transition:background .3s ease}

  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 110px;z-index:1;-webkit-overflow-scrolling:touch}
  .screen:not(.cal){-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 88px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 88px),transparent)} /* scroll-edge fade: content dissolves into the floating tab bar (Apple §12) */
  .screen::-webkit-scrollbar{width:0}
  /* Calendar fills the screen: grid grows to use all vertical space */
  .screen.cal{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .screen.cal .grid{flex:1;min-height:0;grid-auto-rows:1fr;gap:5px;max-height:456px}
  .screen.cal .cell{height:auto}
  .screen.cal .cell .circ{width:100%;height:100%;border-radius:13px;font-size:17px}
  .screen.cal .cell.sel .circ::after{inset:0;border-radius:13px}
  .daybar{flex:0 0 auto;margin-top:auto}

  h1.big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
  .eyebrow{font-size:12px;font-weight:700;color:var(--accent);margin:0;letter-spacing:.3px}
  .sec{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px}
  .muted{color:var(--text2)}.muted3{color:var(--text3)}
  .row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.sp{flex:1}
  .num{font-variant-numeric:tabular-nums}

  .card{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:22px;backdrop-filter:blur(var(--glass-blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.7);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 10px 30px -18px rgba(30,10,50,.5)}
  .r14{border-radius:14px}
  .divider{height:1px;background:var(--divider);border:0;margin:0}
  .tile{border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
  .tile svg{width:52%;height:52%}
  .statcol{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .statcol .v{font-size:20px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .statcol .l{font-size:11.5px;color:var(--text2)}
  .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .press{transition:transform .12s ease}.press:active{transform:scale(.97)}
  @keyframes tilePop{0%{transform:scale(.62)}58%{transform:scale(1.06)}100%{transform:scale(1)}}
  button:focus-visible,[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

  .hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(150deg,#6D4E8C,#3B2456 78%);border:1px solid rgba(255,255,255,.14)}
  .hero::after{content:"";position:absolute;top:-40%;right:-10%;width:70%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
  .hero .k{font-size:12px;font-weight:600;color:rgba(233,224,247,.85);letter-spacing:.3px}
  .hero .v{font-size:38px;font-weight:800;letter-spacing:-1px;margin:6px 0 3px;font-variant-numeric:tabular-nums}
  .hero .s{font-size:12.5px;color:rgba(255,255,255,.72)}

  .brk{display:flex;align-items:center;gap:12px;padding:13px 15px}
  .brk .bd{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brk .bd svg{width:16px;height:16px;color:#fff}
  .brk .nm{font-size:14px;font-weight:600}.brk .sub{font-size:11.5px;color:var(--text2)}
  .brk .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .compbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--fill)}
  .compbar i{height:100%;display:block}

  /* Calendar */
  .navbtn{width:34px;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .navbtn svg{width:16px;height:16px}
  .editbtn{padding:8px 15px;border-radius:11px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
  .editbtn.on{color:#fff;background:var(--accent)}
  .brushbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .brushbar::-webkit-scrollbar{display:none}
  .brush{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);font-size:13px;font-weight:600;transition:.15s}
  .brush.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
  .brush .sw{width:14px;height:14px;border-radius:5px}
  .weekhdr,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .weekhdr span{text-align:center;font-size:11px;font-weight:700;color:var(--text3)}
  .weekhdr span.we{color:var(--accent)}
  .cell{height:46px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
  .cell .circ{width:37px;height:37px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;transition:transform .18s cubic-bezier(.3,1.3,.5,1),background .15s}
  .cell.work .circ{color:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
  .cell.today .circ{outline:2px solid var(--accent);outline-offset:2px;font-weight:800}
  .cell.sel .circ{transform:scale(1.06)}
  .cell.sel .circ::after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2.5px solid var(--accent)}
  .cell.dim{opacity:.32}
  .cell.pp .circ{transform:scale(.85)}
  .cell .ot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:2px;background:var(--gold);z-index:2}
  .cell .hol{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red);z-index:2}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600}
  .mix{display:flex;flex-wrap:wrap;gap:8px}
  .mixchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:var(--fill);font-size:12.5px;font-weight:600}
  .mixchip .ct{color:var(--text2)}

  .listrow{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left;transition:background .16s}
  .listrow:active{background:var(--fill)}
  .toggle{width:50px;height:30px;border-radius:15px;background:var(--fill2);position:relative;transition:.2s;flex:0 0 auto}
  .toggle.on{background:var(--accent)}
  .toggle i{position:absolute;top:2.5px;left:2.5px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
  .toggle.on i{transform:translateX(20px)}
  .field{display:flex;align-items:center;gap:10px;padding:6px 14px}
  .field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 0;outline:none;font-family:inherit}
  .field .cur{font-size:14px;font-weight:600;color:var(--text2)}
  .tinput{width:100%;background:var(--fill);border:1px solid var(--card-border);border-radius:11px;color:var(--text);font-size:15px;padding:12px 14px;outline:none;font-family:inherit}
  .tinput:focus{border-color:var(--accent)}

  .tabbar{position:fixed;left:20px;right:20px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;z-index:7;display:flex;gap:4px;padding:0 8px;align-items:center;background:var(--tabbar);border:1px solid var(--tab-border);border-radius:33px;backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 20px 40px -18px rgba(30,10,50,.5)}
  .tabbtn{position:relative;flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text2);z-index:1;transition:color .2s}
  .tabbtn svg{width:20px;height:20px}.tabbtn span{font-size:9.5px;font-weight:500}
  .tabbtn.on{color:#fff}.tabbtn.on span{font-weight:600}
  .tabhi{position:absolute;top:7px;height:52px;border-radius:26px;background:var(--accent);box-shadow:0 6px 16px -5px var(--accent);z-index:0;transition:transform .34s cubic-bezier(.3,1.1,.35,1),width .34s cubic-bezier(.3,1.1,.35,1)}

  .backdrop{position:absolute;inset:0;z-index:20;background:rgba(10,5,20,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);pointer-events:none;transition:background .3s ease,backdrop-filter .3s ease}
  .backdrop.show{background:rgba(10,5,20,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card2);border-radius:26px 26px 0 0;border-top:1px solid var(--card-border);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:93%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(103%);box-shadow:0 -12px 44px rgba(20,8,40,.4)}
  .sheet.show{animation:sheetIn .42s cubic-bezier(.2,1,.32,1) forwards}
  .sheet.hide{animation:sheetOut .26s ease forwards}
  .sheet.grab{animation:none!important;touch-action:none} /* while dragging: inline transform takes over, and the WebView must not also scroll */
  .sheet.grab .inner{opacity:1;transform:none;animation:none}
  .sheet.dragging{will-change:transform} /* keep the blur — promote to its own layer so the translate stays buttery. Smoothness comes from NOT repainting the backdrop each frame (see sdFrame), not from dropping blur */
  @keyframes sheetIn{from{transform:translateY(103%)}to{transform:translateY(0)}}
  @keyframes sheetOut{from{transform:translateY(0)}to{transform:translateY(103%)}}
  .sheet::-webkit-scrollbar{width:0}
  .sheet .inner{opacity:0;transform:scale(.96);animation:innerIn .4s .06s cubic-bezier(.2,1,.32,1) forwards}
  @keyframes innerIn{to{opacity:1;transform:scale(1)}}
  .handle{width:38px;height:5px;border-radius:3px;background:var(--divider);margin:8px auto 16px}
  .sheethdr{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:16px}
  .sheethdr .t{font-size:16px;font-weight:700;position:absolute;left:50%;transform:translateX(-50%);max-width:56%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .link{color:var(--accent);font-size:16px;font-weight:500}.link.b{font-weight:700}
  .optrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;transition:background .18s}
  .optrow.on{background:var(--accent-soft)}
  .check{color:var(--accent);display:flex}.check svg{width:18px;height:18px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:30px;height:30px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .stepper button:active{transform:scale(.88)}.stepper button svg{width:12px;height:12px}
  .stepper .sv{min-width:58px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

  /* Color picker */
  .cpick{padding:14px;display:flex;flex-direction:column;gap:12px}
  .sv{position:relative;width:100%;height:150px;border-radius:12px;cursor:crosshair;touch-action:none;border:1px solid var(--card-border)}
  .sv-th{position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .hue{position:relative;width:100%;height:16px;border-radius:8px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .hue-th{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .cprow{display:flex;align-items:center;gap:10px}
  .cprev{width:38px;height:38px;border-radius:10px;flex:0 0 auto;border:1px solid var(--card-border)}
  .hexin{flex:1;background:var(--fill);border:1px solid var(--card-border);border-radius:10px;color:var(--text);font-size:15px;font-weight:600;padding:11px 12px;outline:none;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .pcol{width:28px;height:28px;border-radius:8px;position:relative}
  .pcol.on::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2px solid var(--accent)}
  .iconrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .icb{width:42px;height:42px;border-radius:11px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text2)}
  .icb svg{width:20px;height:20px}
  .icb.on{background:var(--accent);color:#fff}
  .delbtn{width:100%;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);font-weight:600;font-size:15px;margin-top:14px;transition:transform .12s}
  .delbtn:active{transform:scale(.98)}

  .preview{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden}
  .preview::after{content:"";position:absolute;top:-30%;right:-10%;width:60%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 60%)}
  .preview .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:1}
  .preview .hd .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
  .preview .hd .ic svg{width:19px;height:19px}
  .preview .stats{display:flex;gap:8px;position:relative;z-index:1}
  .preview .stats .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .preview .stats .l{font-size:11.5px;color:rgba(255,255,255,.78)}

  .csvbox{background:var(--card);border:1px solid var(--card-border);border-radius:14px;max-height:230px;overflow:auto;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--text2);white-space:pre;line-height:1.7}
  .bigbtn{width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;transition:transform .12s}
  .bigbtn:active{transform:scale(.98)}.bigbtn svg{width:18px;height:18px}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);z-index:30;background:var(--accent-strong);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 30px -10px rgba(40,10,60,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ===== v7 polish: motion tokens + iOS refinements ===== */
  .phone{--e-spring:cubic-bezier(.34,1.32,.42,1);--e-out:cubic-bezier(.2,.9,.3,1)}
  .sec{margin-left:4px}
  .handle{width:40px;height:5px;margin:7px auto 14px}
  .sheethdr{padding-bottom:14px;border-bottom:1px solid var(--divider);margin-bottom:16px}
  /* iOS segmented stepper */
  .stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:11px;padding:3px;height:38px;flex:0 0 auto}
  .stepper button{width:36px;height:32px;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

  /* ============================================================
     SOFT UI LAYER — "Sunset" (clean · rounded · light + dark)
     Friendly modern redesign: rounded sans, big rounded cards,
     soft shadows, a vibrant orange accent, floating pill nav.
     Redefines the design tokens (later cascade wins) and restyles
     every surface. All logic, data-actions and i18n are untouched.
     ============================================================ */
  :root{ --page-bg:#ECECEA; --page-fg:#1A1A1E; --bezel:#0b0b0d; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#0b0b0d; --page-fg:#F3F3F5; --bezel:#000; } }

  body{ background:var(--page-bg)!important; }
  .device{ background:var(--bezel); border-radius:46px!important; box-shadow:0 40px 90px -34px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.22) inset!important; }

  /* Rounded, friendly type + radius tokens */
  .phone{ font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; letter-spacing:-.01em; --r-card:24px; --r-tile:15px; --r-pill:999px; }

  /* --- LIGHT tokens --- */
  .phone{
    --bg:#F5F4F1; --bg-wash:none;
    --text:#191A1E; --text2:#6C6D77; --text3:#868791; /* text3 darkened from #9B9CA6 for readable captions on light, still a step lighter than text2 */
    --card:#FFFFFF; --card2:#FFFFFF; --card-border:rgba(18,18,25,.07);
    --divider:rgba(18,18,25,.07); --fill:#F0EFEC; --fill2:#E6E5E1;
    --tabbar:rgba(255,255,255,.9); --tab-border:rgba(18,18,25,.06); --hole:#EFEEEB; --surface:#FFFFFF;
    --accent:#F0600F; --accent-strong:#D24E05; --accent-soft:rgba(240,96,15,.12); --ring:#F0600F;
    --on-accent:#FFFFFF; --gold:#C8912F; --red:#E5484D; --glass-blur:0px;
    --sh:0 12px 32px -14px rgba(20,20,35,.18); --sh-sm:0 5px 16px -8px rgba(20,20,35,.14);
    background:var(--bg); color:var(--text);
  }
  /* --- DARK tokens --- */
  .phone[data-appearance="dark"]{
    --bg:#0F0F13; --bg-wash:none;
    --text:#F4F4F6; --text2:#A2A3AE; --text3:#6E6F79;
    --card:#191920; --card2:#1F1F28; --card-border:rgba(255,255,255,.08);
    --divider:rgba(255,255,255,.07); --fill:#1E1E26; --fill2:#2B2B35;
    --tabbar:rgba(24,24,31,.92); --tab-border:rgba(255,255,255,.09); --hole:#17171D; --surface:#191920;
    --accent:#FF7A3D; --accent-strong:#FF9560; --accent-soft:rgba(255,122,61,.16); --ring:#FF7A3D;
    --on-accent:#2A1206; --gold:#E0B45A; --red:#FF6B6B;
    --sh:0 16px 36px -18px rgba(0,0,0,.7); --sh-sm:0 8px 20px -10px rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: dark){ .phone[data-appearance="auto"]{
    --bg:#0F0F13; --bg-wash:none;
    --text:#F4F4F6; --text2:#A2A3AE; --text3:#6E6F79;
    --card:#191920; --card2:#1F1F28; --card-border:rgba(255,255,255,.08);
    --divider:rgba(255,255,255,.07); --fill:#1E1E26; --fill2:#2B2B35;
    --tabbar:rgba(24,24,31,.92); --tab-border:rgba(255,255,255,.09); --hole:#17171D; --surface:#191920;
    --accent:#FF7A3D; --accent-strong:#FF9560; --accent-soft:rgba(255,122,61,.16); --ring:#FF7A3D;
    --on-accent:#2A1206; --gold:#E0B45A; --red:#FF6B6B;
    --sh:0 16px 36px -18px rgba(0,0,0,.7); --sh-sm:0 8px 20px -10px rgba(0,0,0,.6);

  /* Retire glass / decorative effects */
  .phone>.aurora,.dotpat,.beamborder{ display:none!important; }
  .bgwash{ display:none!important; }

  .phone{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  /* Sheets & dialogs */

  .sheethdr .t{ font-weight:800; }

  /* Buttons / inputs / controls */
  .bigbtn{ background:var(--accent); color:var(--on-accent); border-radius:var(--r-pill)!important; box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 55%,transparent); }
  .editbtn{ background:var(--accent-soft); color:var(--accent); border-radius:var(--r-pill)!important; }

  /* Calendar */
  .cell .circ{ border-radius:14px!important; font-weight:700; }
  .cell:not(.work) .circ{ background:var(--fill)!important; color:var(--text2); }
  .screen.cal .cell.wknd:not(.work) .circ{ background:var(--accent-soft)!important; }

function orthodoxEaster(year){
  const a=year%4,b=year%7,c=year%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;
  const month=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;
  const jd=new Date(Date.UTC(year,month-1,day)); jd.setUTCDate(jd.getUTCDate()+13); return jd;

    t.days++;t.paidH+=b.reg; if(b.s.night)t.nightH+=b.reg; t.otDayH+=b.otD;t.otNightH+=b.otN;

function countUp(el,to,dur){ to=+to||0; if(reduce||to===0){el.textContent=fmtN(to);return;}
  const start=performance.now(); const ease=p=>1-Math.pow(1-p,3);
  function step(now){ const p=Math.min(1,(now-start)/(dur||700)); el.textContent=fmtN(to*ease(p)); if(p<1)requestAnimationFrame(step); else el.textContent=fmtN(to); }
  requestAnimationFrame(step);
}

  const intro=!hubIntroDone; // the first hub paint since app launch: play the full intro (shimmer + count-up). Later hub visits keep the numbers stable (they're already the final values in the HTML) so the hub doesn't feel like it "refreshes".
  if(reduce){hubIntroDone=true;state.celebrate=false;return;}
  el.querySelectorAll('.hero').forEach(c=>{
    if(intro){ const s=document.createElement('div'); s.className='shimfx'; c.appendChild(s); setTimeout(()=>s.remove(),1100); } // shimmer sweep plays ONCE per app launch
    if(state.celebrate){ c.classList.add('celebrate'); setTimeout(()=>c.classList.remove('celebrate'),640); } }); // one-time achievement pop after setup
  hubIntroDone=true;state.celebrate=false;
  if(intro) el.querySelectorAll('[data-count]').forEach(n=>{ n.textContent=fmtN(0); countUp(n,n.getAttribute('data-count'),720); }); // count-up only on launch
}

function calendarCells(){
  const y=state.viewY,m=state.viewM;
  const first=weekCol(y,m,1);
  const dim=new Date(y,m+1,0).getDate();
  const prevDim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=first-1;i>=0;i--){ const d=prevDim-i; const pm=m===0?11:m-1, py=m===0?y-1:y; cells.push({y:py,m:pm,d,iso:isoOf(py,pm,d),dim:true}); }
  for(let d=1;d<=dim;d++) cells.push({y,m,d,iso:isoOf(y,m,d),dim:false});
  let nd=1; while(cells.length%7!==0 || cells.length<42){ const nm=m===11?0:m+1, ny=m===11?y+1:y; cells.push({y:ny,m:nm,d:nd,iso:isoOf(ny,nm,nd),dim:true}); nd++; if(cells.length>=42)break; }
  return cells;
}
function weekTotalOf(iso){ // total estimated pay for the week (region weekStart-aware) containing iso
  const [y,m,d]=iso.split('-').map(Number), dt=new Date(y,m-1,d), back=(dt.getDay()-state.region.weekStart+7)%7; let sum=0; const bhC={};
  for(let i=0;i<7;i++){ const c=new Date(y,m-1,d-back+i), cy=c.getFullYear(), cm=c.getMonth(), k=cy+'.'+cm;
    const bh=bhC[k]!==undefined?bhC[k]:(bhC[k]=baseHourly(cy,cm)); // baseHourly scans the month; a week spans ≤2 months, so cache it instead of recomputing 7×
    const b=dayBreakdown({iso:isoOf(cy,cm,c.getDate()),y:cy,m:cm,d:c.getDate()},bh); if(b)sum+=b.total; }
  return sum;
}
function weeklineHTML(){ const wk=weekTotalOf(state.selISO); return wk>0?`<div class="muted" style="text-align:center;margin-top:11px;font-size:12.5px">${tr('This week')} · <span class="num" style="font-weight:700;color:var(--text)">${fmtN(wk)}</span> ${cur()}</div>`:''; }
function daybarInner(){ // selected-day card body — shared by screenCalendar (initial) and selectDay (surgical update)
  const [sy,sm,sd]=state.selISO.split('-').map(Number);
  const selShift=assignedShift(state.selISO), bh=baseHourly(state.viewY,state.viewM);
  const b=dayBreakdown({iso:state.selISO,y:sy,m:sm-1,d:sd},bh);
  const smeta=metaOf(state.selISO), swe=isWeekend(sy,sm-1,sd), shol=isHolISO(state.selISO);
  const SC=state.salary;
  const badges = (selShift&&selShift.vac) ? `<span class="badge" style="background:var(--accent-soft);color:var(--accent)">${tr('Paid leave')}</span>` : [
    (selShift&&selShift.night&&SC.night.on)?`<span class="badge" style="background:#6366F122;color:#818CF8">+${SC.night.pct}%</span>`:'',
    (swe&&SC.weekend.on)?`<span class="badge" style="background:#14B8A622;color:#14B8A6">+${SC.weekend.pct}% we</span>`:'',
    (shol&&SC.holiday.on)?`<span class="badge" style="background:var(--red);color:#fff;opacity:.85">+${SC.holiday.pct}% hol</span>`:'',
    (smeta.otDay&&SC.overtime.on)?`<span class="badge" style="background:#F2A63C22;color:var(--gold)">${smeta.otDay}h OT</span>`:'',
    (smeta.otNight&&SC.overtime.on)?`<span class="badge" style="background:#8B5CF622;color:#8B5CF6">${smeta.otNight}h OT·n</span>`:''
  ].filter(Boolean).join('');
  return `<div class="row" style="gap:11px">

      <span style="width:14px;height:14px;display:flex;color:var(--accent)">${I.bolt}</span>
    </div>`;

function screenCalendar(){

  const todayISO=isoOf(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());

    const s=assignedShift(c.iso), work=!!s;
    const sel=state.selISO===c.iso, today=todayISO===c.iso;
    const mm=metaOf(c.iso), hasOt=(mm.otDay+mm.otNight)>0, hol=isHolISO(c.iso);
    const wknd=isWeekend(c.y,c.m,c.d);
    const bg = work ? s.color : (today ? 'var(--accent-soft)' : 'var(--fill)'); // today (with no shift) reads as an accent chip so it stands out from the tiny outline alone

  ${state.editMode?`<div class="brushbar">${brushes}</div>`:''}

  <div class="weekhdr" style="margin-bottom:5px">${wd.map(w=>`<span class="${w.we?'we':''}">${w.l}</span>`).join('')}</div>
  <div class="grid ${gridSlide}" id="calgrid">${cells}</div>
  ${(()=>{
    const monthEmpty=monthISOs(state.viewY,state.viewM).every(x=>!assignedShift(x.iso));
    if(monthEmpty&&!state.editMode) return `<button class="card press" data-action="toggleEdit" style="padding:12px 14px;margin-top:11px;display:flex;align-items:center;gap:11px;text-align:left;width:100%">

    return `<div id="weekline">${weeklineHTML()}</div>`;

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let ringPrev=null, gridSlide='';
function renderScreen(animate){const el=document.getElementById('screen');const top=el.scrollTop;el.classList.toggle('cal',state.tab==='calendar');el.innerHTML=screenHTML();if(state.tab!=='calendar')el.scrollTop=top;
  if(state.tab==='calendar') requestAnimationFrame(placeSelRing);
  if(state.tab==='hub'){ state.hubDirty=false; requestAnimationFrame(animateHub); } // shimmer + count-up on every hub entry / month swipe
  if(animate&&!reduce){el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim');clearTimeout(el._animT);el._animT=setTimeout(()=>el.classList.remove('anim'),780);}}
function placeSelRing(){
  const grid=document.getElementById('calgrid'); if(!grid) return;
  const cell=grid.querySelector(`.cell[data-iso="${state.selISO}"]`);
  let ring=grid.querySelector('.calsel');
  if(!cell){ if(ring) ring.remove(); ringPrev=null; return; }
  // offset* is relative to the offsetParent (#calgrid, position:relative) and is
  // NOT affected by CSS transforms (e.g. the screen entrance scale), so the ring
  // aligns correctly even while an entrance animation is mid-flight.
  const x=cell.offsetLeft, y=cell.offsetTop, w=cell.offsetWidth, h=cell.offsetHeight;
  if(!ring){ ring=document.createElement('div'); ring.className='calsel'; grid.appendChild(ring); }
  ring.style.width=w+'px'; ring.style.height=h+'px'; ring.style.transform=`translate(${x}px,${y}px)`;
  if(ringPrev && !reduce && (ringPrev.x!==x||ringPrev.y!==y)){
    ring.animate([{transform:`translate(${ringPrev.x}px,${ringPrev.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:360,easing:getComputedStyle(document.querySelector('.phone')).getPropertyValue('--e-spring')||'ease'});
  }
  ringPrev={x,y};
}

/* ===== Backup & restore (full state as versioned JSON) ===== */
function exportBackup(){const data={};SK.forEach(k=>data[k]=state[k]);
  return JSON.stringify({app:'shifthub',v:4,exportedAt:new Date().toISOString(),data},null,2);}
function copyBackup(){const t=exportBackup();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(tr('Backup copied'))).catch(()=>toast(tr('Copy blocked here')));else toast(tr('Copy blocked here'));}
async function downloadBackup(){const t=exportBackup();
  const fname='shifthub-backup-'+isoOf(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())+'.json';
  // Expo WebView: <a download> + blob is unreliable on iOS WKWebView (it ends up saving the page HTML, not our JSON) — hand the backup to the native layer, which opens the iOS share sheet (Save to Files / Mail / AirDrop) with exactly this JSON.
  if(window.ReactNativeWebView&&window.ReactNativeWebView.postMessage){
    window.ReactNativeWebView.postMessage('backup:'+fname+'\n'+t);
    toast(tr('Backup ready'));return;
  }
  // Claude artifact runtime: browser downloads are blocked, use the downloads capability
  if(window.claude&&typeof claude.use==='function'){
    try{const dl=await claude.use('downloads');
      if(dl){await dl.save({filename:fname,data:t});toast(tr('Backup saved'));return;}
    }catch(e){ if(e&&e.code==='declined')return; }
  }
  // Standalone / installed PWA: native file download
  try{const blob=new Blob([t],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(tr('Backup downloaded'));
  }catch(e){copyBackup();}}
function applyBackup(obj){
  SK.forEach(k=>{if(obj.data[k]!==undefined)state[k]=obj.data[k];});
  // forward-compat salary shape (same normalization as loadState)
  const d={net:4000,overtime:{on:true,pct:75},night:{on:true,pct:25},weekend:{on:true,pct:10},holiday:{on:true,pct:100}};
  state.salary=Object.assign({},d,state.salary||{});
  ['overtime','night','weekend','holiday'].forEach(k=>{state.salary[k]=Object.assign({},d[k],state.salary[k]||{});});
  state.region=Object.assign({country:'RO',currency:'RON',locale:'en-US',weekendDays:[0,6],weekStart:1,stdHours:8,customHolidays:[]},state.region||{});
  if(!Array.isArray(state.region.customHolidays)) state.region.customHolidays=[];

  state.sheet=null;state.hubDirty=true;saveState();renderAll();}
function restoreFromText(text){
  if(!text||!text.trim()){toast(tr('Paste a backup or pick a file'));return;}
  let obj;try{obj=JSON.parse(text);}catch(e){toast(tr('Invalid backup file'));return;}
  if(!obj||obj.app!=='shifthub'||typeof obj.data!=='object'){toast(tr('Not a ShiftHub backup'));return;}

/* ===== Sheet drag-to-dismiss (Apple-style: 1:1 tracking, rubber-band, velocity dismiss, spring-back, interruptible) ===== */
let sd=null, sdRaf=0;

  sd.sh.style.transform='translateY('+sd.y+'px)'; // ONLY move the sheet (GPU transform). The backdrop stays untouched during the drag so its blur is never re-rasterised — that per-frame re-blur was the stutter. The dim fades only on release (dismiss/spring-back below).
  sdRaf=requestAnimationFrame(sdFrame); }
document.addEventListener('pointerdown',e=>{
  if(!state.sheet)return;const sh=document.getElementById('sheet');

  const r=sh.getBoundingClientRect(),hdr=sh.querySelector('.sheethdr');
  const fromHandle=(e.clientY-r.top)<(hdr?hdr.getBoundingClientRect().bottom-r.top:64)+48; // grab zone = handle + header row + a 48px cushion below, so the thumb can start the drag from mid-way down the top of the sheet, not just the tiny 5px bar (the bar sits very high)
  if(!fromHandle&&sh.scrollTop>2)return; // content is scrolled → let native scroll handle it
  sh.style.touchAction='none'; // CLAIM the gesture from frame one (handle OR content-at-top). With pointer events, only touch-action stops the inner scroller from grabbing the first down-drag (its rubber-band is the "top expands, first swipe ignored" bug). We still support scroll-up-into-content via the manual-scroll branch in pointermove, so nothing is lost.
  sh.style.transition='none'; // interrupt any running settle
  sd={sh,id:e.pointerId,y0:e.clientY,off:sheetY(sh),h:sh.getBoundingClientRect().height||1,hist:[{y:e.clientY,t:performance.now()}],active:false,fromHandle,startScroll:sh.scrollTop};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sd||e.pointerId!==sd.id)return;const dy=e.clientY-sd.y0;
  if(!sd.active){

      sd.active=true;sd.scrolling=true;
    }else{ // DOWN (from anywhere) or any drag from the handle → dismiss drag: the whole sheet follows the finger
      sd.active=true;sd.sh.classList.add('grab','dragging'); // .dragging just promotes the sheet to its own layer; the backdrop keeps its blur untouched
      try{sd.sh.setPointerCapture(sd.id);}catch(_){}

  let y=sd.off+dy;if(y<0)y=-rubber(-y,sd.h);sd.y=y; // just record the target; sdFrame paints it

  s.sh.style.touchAction=''; // restore normal scrolling

  if(s.scrolling)return; // it was a content scroll, not a dismiss
  try{s.sh.releasePointerCapture(s.id);}catch(_){}
  const bd=document.getElementById('backdrop');
  const a=s.hist[0],b=s.hist[s.hist.length-1],dt=Math.max(1,b.t-a.t),v=(b.y-a.y)/dt; // px/ms, +down
  const projected=s.y+v*160; // momentum projection
  const dismiss=projected>Math.min(s.h*0.35,180)||v>0.5; // cap the distance threshold so tall sheets (New shift) still close with a normal pull, not only a big one
  if(dismiss){

    setTimeout(()=>{s.sh.classList.remove('grab','dragging','show');s.sh.style.transition='';s.sh.style.transform='';bd.classList.remove('show');bd.style.transition='none';bd.style.opacity='';},dur*1000+40); // transition:none, NOT '' — clearing to '' revives the base .backdrop backdrop-filter .3s transition, so the leftover blur(3px) re-animates to 0 while opacity snaps back to 1 = the background flashes blurred for ~300ms after close. 'none' applies the hidden state instantly & invisibly; renderSheet clears it before the next open.
    state.sheet=null;
  }else{
    s.sh.style.transition=reduce?'none':'transform .42s cubic-bezier(.32,1.07,.4,1)';s.sh.style.transform='translateY(0)'; // spring back
    setTimeout(()=>{s.sh.classList.remove('dragging');},reduce?0:440); // drop the layer promotion once it settles
  }
},{passive:true});
document.addEventListener('pointercancel',()=>{ // if the gesture is ever cancelled, don't leave the sheet stuck: restore scroll and spring back
  if(!sd)return;const s=sd;sd=null;if(sdRaf){cancelAnimationFrame(sdRaf);sdRaf=0;}
  s.sh.style.touchAction='';if(!s.active||s.scrolling)return;
  s.sh.style.transition=reduce?'none':'transform .32s cubic-bezier(.32,1.07,.4,1)';s.sh.style.transform='translateY(0)';
  setTimeout(()=>{s.sh.classList.remove('dragging');},reduce?0:340);
},{passive:true});

/* ===== Swipe to change month: horizontal swipe on the HUB pay card or the calendar grid ===== */
let msw=null;
document.addEventListener('pointerdown',e=>{
  if(state.sheet||state.editMode||!e.target.closest)return;
  const on = state.tab==='hub' ? e.target.closest('.hero') : state.tab==='calendar' ? e.target.closest('#calgrid') : null;
  if(on) msw={x:e.clientX,y:e.clientY,decided:false,ok:false};
});
document.addEventListener('pointermove',e=>{
  if(!msw||msw.decided)return; const dx=e.clientX-msw.x, dy=e.clientY-msw.y;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  msw.decided=true; msw.ok=Math.abs(dx)>Math.abs(dy)*1.3; // commit only to a clearly horizontal drag
});
document.addEventListener('pointerup',e=>{
  if(!msw)return; const s=msw; msw=null; if(!s.decided||!s.ok)return;
  const dx=e.clientX-s.x; if(Math.abs(dx)<45)return; // ignore short flicks
  suppressClick=true; setTimeout(()=>suppressClick=false,60); // don't let the swipe also select a day
  changeMonth(dx<0?1:-1); // left → next month, right → previous
});
function confirmDialog(title,msg,okLabel,onOk){
  const back=document.getElementById('dlgback');
  back.innerHTML=`<div class="dlg"><h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="acts"><button class="cancel" data-dlg="cancel">${tr('Cancel')}</button><button class="danger shine" data-dlg="ok">${esc(okLabel)}</button></div></div>`;
  requestAnimationFrame(()=>back.classList.add('show'));
  const close=()=>{ back.classList.remove('show'); setTimeout(()=>{back.innerHTML='';},260); };
  back.onclick=(ev)=>{ if(ev.target===back){close();return;} const b=ev.target.closest('[data-dlg]'); if(!b)return; if(b.dataset.dlg==='ok'){ close(); onOk(); } else close(); };
}
function openQuickDay(iso){ // quick-assign sheet from a long-press on a calendar day
  const back=document.getElementById('dlgback');
  const [y,m,d]=iso.split('-').map(Number);
  const yest=new Date(y,m-1,d-1), yISO=isoOf(yest.getFullYear(),yest.getMonth(),yest.getDate()), yShift=assignedShift(yISO);
  const curId=state.assignments[iso];
  const sw=c=>`<span style="width:15px;height:15px;border-radius:5px;background:${c};flex:0 0 auto"></span>`;
  const chk=`<span class="check" style="width:16px;height:16px">${I.check}</span>`;
  let rows=state.shifts.map(s=>`<button class="optrow press${curId===s.id?' on':''}" data-qd="${s.id}">${sw(s.color)}<span style="flex:1;font-size:15px">${shiftLabel(s)}</span>${curId===s.id?chk:''}</button>`).join('');
  rows+=`<button class="optrow press${!curId?' on':''}" data-qd="off">${sw('#8C8598')}<span style="flex:1;font-size:15px">${tr('Off')}</span>${!curId?chk:''}</button>`;
  if(yShift) rows+=`<button class="optrow press" data-qd="dup">${sw(yShift.color)}<span style="flex:1;font-size:15px">${tr('Duplicate yesterday')}</span><span class="muted" style="font-size:12px">${shiftLabel(yShift)}</span></button>`;
  back.innerHTML=`<div class="dlg" style="text-align:left;padding:16px 10px 12px"><h4 style="text-align:center;margin:0 0 2px">${d} ${cap(monthName(m-1,true))}</h4><p style="text-align:center;margin:0 0 12px">${tr('Assign a shift')}</p><div class="col" style="gap:3px">${rows}</div></div>`;
  requestAnimationFrame(()=>back.classList.add('show'));
  const close=()=>{ back.classList.remove('show'); setTimeout(()=>{back.innerHTML='';back.onclick=null;},260); };
  back.onclick=(ev)=>{ if(suppressClick){suppressClick=false;return;} // swallow the trailing synthetic click from the long-press that opened this sheet (it fires on touch after pointerup and would otherwise close it or mis-assign a shift)
    if(ev.target===back){close();return;} const bq=ev.target.closest('[data-qd]'); if(!bq)return;
    let id=bq.getAttribute('data-qd'); if(id==='dup') id=yShift?yShift.id:'off';
    if(id==='off') delete state.assignments[iso]; else state.assignments[iso]=id;
    state.selISO=iso; state.hubDirty=true; saveState(); close(); renderScreen(); hap(10); };
}
function animateDeleteShift(id){
  const el=document.querySelector(`.swipe[data-id="${id}"]`);
  if(!el||reduce){ removeShift(id); renderScreen(); return; }
  el.classList.remove('open');
  const h=el.offsetHeight; el.style.height=h+'px'; el.classList.add('removing'); void el.offsetWidth;
  el.style.height='0px'; el.style.opacity='0'; el.style.marginTop='-10px';
  setTimeout(()=>{ removeShift(id); renderScreen(); }, 360);
}

document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return;}
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const raw=btn.getAttribute('data-action');const ci=raw.indexOf(':');const cmd=ci<0?raw:raw.slice(0,ci),arg=ci<0?'':raw.slice(ci+1);
  switch(cmd){
    case 'tab': if(state.tab!==arg){ringPrev=null;state.tab=arg;renderTabbar();renderScreen(true);} break;
    case 'selday': if(!state.editMode){ selectDay(arg); } break;
    case 'gotoDay': { const [gy,gm,gd]=arg.split('-').map(Number); state.viewY=gy;state.viewM=gm-1;state.selISO=arg;ringPrev=null;state.tab='calendar';renderTabbar();renderScreen(true);hap(6); } break;
    case 'toggleEdit': ringPrev=null;state.editMode=!state.editMode;renderScreen(); break;
    case 'brush': state.brush=arg;renderScreen(); break;
    case 'prevMonth': changeMonth(-1); break;
    case 'nextMonth': changeMonth(1); break;
    case 'today': { const ty=TODAY.getFullYear(),tm=TODAY.getMonth(); state.viewY=ty;state.viewM=tm;state.selISO=isoOf(ty,tm,TODAY.getDate());ringPrev=null;renderScreen(true);hap(6); } break;
    case 'dayMeta': openDayMeta(); break;
    case 'openSettings': state.themeOpen=false;state.sheet='settings';renderSheet(); break;
    case 'openSalary': state.sheet='salary';renderSheetUpdate(); break;
    case 'openRegion': state.sheet='region';renderSheetUpdate(); break;
    case 'lang': state.lang=arg; try{document.documentElement.lang=arg;}catch(e){} saveState(); renderAll(); renderSheetUpdate(); break;
    case 'curr': state.region.currency=arg;state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'nfmt': state.region.locale=arg;_nfLoc=null;state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'wstart': state.region.weekStart=+arg;saveState();renderSheetUpdate(); break;
    case 'wday': { const dd=+arg,s=new Set(state.region.weekendDays); s.has(dd)?s.delete(dd):s.add(dd); state.region.weekendDays=[...s].sort((a,b)=>a-b); state.hubDirty=true;saveState();renderSheetUpdate(); } break;
    case 'stdM': state.region.stdHours=Math.max(1,Math.round((state.region.stdHours-0.5)*2)/2);state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'stdP': state.region.stdHours=Math.min(24,Math.round((state.region.stdHours+0.5)*2)/2);state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'country': { const C=COUNTRIES[arg]; if(C){ state.region.country=arg; state.region.currency=C.cur; state.region.weekStart=C.ws; state.region.weekendDays=C.we.slice(); state.region.stdHours=C.h; } clearHolidayCache();state.hubDirty=true;saveState();renderSheetUpdate(); } break;
    case 'chMm': state.chDraft.m=((state.chDraft.m-2+12)%12)+1; if(state.chDraft.d>daysInMon(state.chDraft.m))state.chDraft.d=daysInMon(state.chDraft.m); renderSheetUpdate(); break;
    case 'chMp': state.chDraft.m=(state.chDraft.m%12)+1; if(state.chDraft.d>daysInMon(state.chDraft.m))state.chDraft.d=daysInMon(state.chDraft.m); renderSheetUpdate(); break;
    case 'chDm': state.chDraft.d=state.chDraft.d<=1?daysInMon(state.chDraft.m):state.chDraft.d-1; renderSheetUpdate(); break;
    case 'chDp': state.chDraft.d=state.chDraft.d>=daysInMon(state.chDraft.m)?1:state.chDraft.d+1; renderSheetUpdate(); break;
    case 'chAdd': { const el=document.getElementById('chname'); const nm=((el?el.value:state.chDraft.name)||'').trim()||'Holiday'; state.region.customHolidays.push({m:state.chDraft.m,d:state.chDraft.d,name:nm}); state.chDraft={m:1,d:1,name:''}; clearHolidayCache();state.hubDirty=true;saveState();renderSheetUpdate(); } break;
    case 'chDel': state.region.customHolidays.splice(+arg,1); clearHolidayCache();state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'onbNext': state.onbDir='f'; state.onbStep=Math.min(3,(state.onbStep||0)+1); renderOnboard(); break;
    case 'onbBack': state.onbDir='b'; state.onbStep=Math.max(0,(state.onbStep||0)-1); renderOnboard(); break;
    case 'onbPrem': { const b=state.salary[arg]; if(b){ b.on=!b.on; const btn=e.target.closest('.toggle'); if(btn){ btn.classList.toggle('on',b.on); btn.setAttribute('aria-pressed',b.on); } else { state.onbDir=''; renderOnboard(); } } } break;
    case 'onbGoto': state.onbDir='b'; state.onbStep=+arg; renderOnboard(); break;
    case 'onbCountry': { state.onbCountry=arg; const box=document.querySelector('#onboard .grp'); // update in place so the list keeps its scroll position
      if(box){ box.querySelectorAll('.optrow').forEach(btn=>{ const on=btn.getAttribute('data-action')==='onbCountry:'+arg; btn.classList.toggle('on',on); const chk=btn.querySelector('.check'); if(on&&!chk) btn.insertAdjacentHTML('beforeend',`<span class="check" style="width:16px;height:16px">${I.check}</span>`); else if(!on&&chk) chk.remove(); }); } else { state.onbDir=''; renderOnboard(); } } break;
    case 'onbFinish': { const el=document.getElementById('onbnet'); const v=el?parseInt(el.value||'0',10):state.salary.net; const C=COUNTRIES[state.onbCountry];
      if(C){ state.region.country=state.onbCountry; state.region.currency=C.cur; state.region.weekStart=C.ws; state.region.weekendDays=C.we.slice(); state.region.stdHours=C.h; }
      if(!isNaN(v)&&v>0) state.salary.net=v;
      clearHolidayCache(); state.onboarded=true; state.hubDirty=true; state.celebrate=true; saveState(); renderOnboard(); renderAll(); hap([12,50,24]); toast(tr('Welcome to Shift Hub')); } break;
    case 'backSettings': state.sheet='settings';renderSheetUpdate(); break;
    case 'themeToggle': state.themeOpen=!state.themeOpen;renderSheetUpdate(); break;
    case 'export': state.sheet='export';renderSheetUpdate(); break;
    case 'openBackup': state.sheet='backup';renderSheetUpdate(); break;
    case 'runOnboard': closeSheet(); state.onboarded=false; state.onbStep=0; state.onbDir='f'; state.onbCountry=state.region.country||detectCountry(); renderAll(); break;
    case 'wipeData': confirmDialog(tr('Delete all data'), tr('This permanently erases all your shifts, settings and pay data on this device. This cannot be undone.'), tr('Delete'), ()=>{ try{localStorage.removeItem('shifthub_v4');}catch(e){} hap([15,40,15]); location.reload(); }); break;
    case 'backupDownload': downloadBackup(); break;
    case 'backupCopy': copyBackup(); break;
    case 'backupRestore': {const el=document.getElementById('backuptext');restoreFromText(el?el.value:'');} break;
    case 'appear': state.appearance=arg;state.themeOpen=false;applyAppearance();saveState();renderSheetUpdate(); break;
    case 'notif': state.notifications=!state.notifications;hap(6);saveState();renderSheetUpdate(); break;
    case 'bon': state.salary[arg].on=!state.salary[arg].on;hap(6);state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'bpm': state.salary[arg].pct=Math.max(0,state.salary[arg].pct-5);state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'bpp': state.salary[arg].pct=Math.min(300,state.salary[arg].pct+5);state.hubDirty=true;saveState();renderSheetUpdate(); break;
    case 'sheetClose': closeSheet(); renderScreen(); break;
    case 'addShift': openNewShift(); break;
    case 'editShift': openShift(arg); break;
    case 'delSwipe': { const s=shiftById(arg); confirmDialog(tr('Delete shift?'), (s?s.name:tr('This shift'))+' '+tr('will be removed and any days using it set to Off.'), tr('Delete'), ()=>animateDeleteShift(arg)); } break;
    /* meta sheet */
    case 'otDayM': state.draftOtDay=Math.max(0,state.draftOtDay-1);renderSheetUpdate(); break;
    case 'otDayP': state.draftOtDay=Math.min(16,state.draftOtDay+1);renderSheetUpdate(); break;
    case 'otNightM': state.draftOtNight=Math.max(0,state.draftOtNight-1);renderSheetUpdate(); break;
    case 'otNightP': state.draftOtNight=Math.min(16,state.draftOtNight+1);renderSheetUpdate(); break;
    case 'holToggle': state.draftHoliday=!state.draftHoliday;renderSheetUpdate(); break;
    case 'metaSave': saveMeta(); break;
    /* shift sheet */
    case 'sM': state.d.start=(state.d.start-30+1440)%1440;refreshShiftSheet(); break;
    case 'sP': state.d.start=(state.d.start+30)%1440;refreshShiftSheet(); break;
    case 'eM': state.d.end=(state.d.end-30+1440)%1440;refreshShiftSheet(); break;
    case 'eP': state.d.end=(state.d.end+30)%1440;refreshShiftSheet(); break;
    case 'bM': state.d.brk=Math.max(0,state.d.brk-5);refreshShiftSheet(); break;
    case 'bP': state.d.brk=Math.min(180,state.d.brk+5);refreshShiftSheet(); break;
    case 'shNight': state.d.night=!state.d.night;refreshShiftSheet(); break;
    case 'shVac': state.d.vac=!state.d.vac; if(state.d.vac){state.d.brk=0;state.d.night=false;} refreshShiftSheet(); break;
    case 'vacHM': { let dur=((state.d.end-state.d.start+1440)%1440)||1440; dur=Math.max(30,dur-30); state.d.end=(state.d.start+dur)%1440; refreshShiftSheet(); } break;
    case 'vacHP': { let dur=((state.d.end-state.d.start+1440)%1440)||1440; dur=Math.min(1440,dur+30); state.d.end=(state.d.start+dur)%1440; refreshShiftSheet(); } break;
    case 'shIcon': state.d.icon=arg;refreshShiftSheet(); break;
    case 'preset': state.pk=hexToHsv(arg);updatePickerUI(); break;
    case 'shiftSave': saveShift(); break;
    case 'shiftDelete': deleteShift(); break;
    /* export */
    case 'csvCopy': {const txt=csvExport(state.viewY,state.viewM);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(tr('CSV copied'))).catch(()=>toast(tr('Copy blocked here')));else toast(tr('Copy blocked here'));} break;
  }
});

let spotRAF=0,spotEvt=null,litEl=null;

  spotRAF=requestAnimationFrame(()=>{ spotRAF=0; const ev=spotEvt; if(!ev)return;
    const el=document.elementFromPoint(ev.clientX,ev.clientY); const card=el&&el.closest?el.closest('.spot'):null;
    if(card!==litEl){ if(litEl)litEl.classList.remove('lit'); litEl=card; if(card)card.classList.add('lit'); }

  });
},{passive:true});
