<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<style>html,body{height:100%;margin:0;background:#0F0F13;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}
body.pwa{padding:0!important;display:block!important;background:#0F0F13}
body.pwa .tagline{display:none!important}
body.pwa .device{border-radius:0!important;padding:0!important;width:100vw!important;height:100dvh!important;box-shadow:none!important;background:#0F0F13}
body.pwa .phone{border-radius:0!important}</style></head><body class="pwa"><title>Shift Hub</title>
<style>
  :root{ --page-bg:#e7e3ef; --page-fg:#1a1526; --bezel:#0a0710; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; } }
  :root[data-theme="dark"]{ --page-bg:#0a0710; --page-fg:#ece7f5; --bezel:#000; }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(130% 90% at 50% -10%, color-mix(in srgb,var(--page-bg) 78%, #6366F1 22%), var(--page-bg) 62%);color:var(--page-fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;min-height:100%}
  .tagline{font-size:12.5px;color:color-mix(in srgb,var(--page-fg) 55%, transparent);text-align:center;max-width:400px;line-height:1.55}
  .tagline b{color:var(--page-fg);font-weight:600}

  .device{width:390px;max-width:100%;height:min(844px, calc(100dvh - 88px));background:var(--bezel);border-radius:52px;padding:11px;box-shadow:0 40px 90px -34px rgba(60,30,90,.7),0 0 0 2px rgba(255,255,255,.04) inset}

  .phone{position:relative;height:100%;width:100%;border-radius:42px;overflow:hidden;isolation:isolate;
    /* LIGHT — refined violet (shadcn-clean) */
    --bg:#F6F4FB;--bg-wash:radial-gradient(120% 70% at 50% 0%, #EEE9F8 0%, #F6F4FB 55%);
    --text:#17121F;--text2:#6E6785;--text3:#9A93AC;
    --card:rgba(255,255,255,.72);--card2:rgba(255,255,255,.86);--card-border:rgba(40,20,70,.10);
    --divider:rgba(40,20,70,.08);--fill:rgba(122,87,200,.09);--fill2:rgba(122,87,200,.15);
    --tabbar:rgba(255,255,255,.6);--tab-border:rgba(40,20,70,.08);--hole:#F1ECF8;--surface:#FFFFFF;
    --accent:#7A57C8;--accent-strong:#6A46BC;--accent-soft:rgba(122,87,200,.13);--ring:#7A57C8;
    --gold:#B98F3E;--red:#DC5A50;--glass-blur:22px;
    background:var(--bg);color:var(--text);font-size:14px}
  .phone[data-appearance="dark"]{--bg:#0A0711;--bg-wash:radial-gradient(120% 78% at 50% 0%, #17102A 0%, #0B0713 46%, #060409 82%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;
    --card:rgba(24,18,34,.6);--card2:rgba(30,23,42,.75);--card-border:rgba(170,140,225,.13);
    --divider:rgba(200,180,235,.09);--fill:rgba(150,120,215,.14);--fill2:rgba(150,120,215,.22);
    --tabbar:rgba(22,16,32,.55);--tab-border:rgba(180,150,230,.16);--hole:#150E22;--surface:#161020;
    --accent:#8B6DE0;--accent-strong:#AB90F2;--accent-soft:rgba(139,109,224,.2);--ring:#8B6DE0;--gold:#D8B25A;--red:#F0776E}
  @media (prefers-color-scheme: dark){ .phone[data-appearance="auto"]{--bg:#0A0711;--bg-wash:radial-gradient(120% 78% at 50% 0%, #17102A 0%, #0B0713 46%, #060409 82%);
    --text:#F2EEF9;--text2:#A79FBC;--text3:#7C7590;--card:rgba(24,18,34,.6);--card2:rgba(30,23,42,.75);--card-border:rgba(170,140,225,.13);
    --divider:rgba(200,180,235,.09);--fill:rgba(150,120,215,.14);--fill2:rgba(150,120,215,.22);
    --tabbar:rgba(22,16,32,.55);--tab-border:rgba(180,150,230,.16);--hole:#150E22;--surface:#161020;--accent:#8B6DE0;--accent-strong:#AB90F2;--accent-soft:rgba(139,109,224,.2);--ring:#8B6DE0;--gold:#D8B25A;--red:#F0776E}}

  .bgwash{position:absolute;inset:0;background:var(--bg-wash);z-index:0;pointer-events:none}

  .screen{position:absolute;inset:0;top:env(safe-area-inset-top,0px);overflow-y:auto;overflow-x:hidden;padding:20px 16px 110px;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .screen:not(.cal){-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12px,#000 calc(100% - 88px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 12px,#000 calc(100% - 88px),transparent)} /* scroll-edge fades: content dissolves into the floating tab bar (Apple §12) and, at the top, just below the status bar */
  /* the scroller itself starts below the status bar / notch / Dynamic Island (top = safe-area inset), so scrolled content is clipped there instead of passing under the clock */
  .screen::-webkit-scrollbar{width:0}
  /* Calendar fills the screen: grid grows to use all vertical space */
  .screen.cal{display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .screen.cal .grid{flex:1;min-height:0;grid-auto-rows:1fr;gap:5px;max-height:456px}
  .screen.cal .cell{height:auto}
  .screen.cal .cell .circ{width:100%;height:100%;border-radius:13px;font-size:17px}
  .screen.cal .cell.sel .circ::after{inset:0;border-radius:13px}
  .daybar{flex:0 0 auto;margin-top:auto}
  @media (max-width:410px) and (max-height:780px){.screen.cal .daybar{min-height:84px}} /* the grid takes the leftover height here, so a day card that wraps to two lines would shrink every cell: reserve the two lines */

  h1.big{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
  .eyebrow{font-size:12px;font-weight:700;color:var(--accent);margin:0;letter-spacing:.3px}
  .sec{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px}
  .muted{color:var(--text2)}.muted3{color:var(--text3)}
  .row{display:flex;align-items:center}.col{display:flex;flex-direction:column}.sp{flex:1}
  .num{font-variant-numeric:tabular-nums}

  .card{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:22px;backdrop-filter:blur(var(--glass-blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.7);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 10px 30px -18px rgba(30,10,50,.5)}
  .r14{border-radius:14px}
  .divider{height:1px;background:var(--divider);border:0;margin:0}
  .tile{border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
  .tile svg{width:52%;height:52%}
  .statcol{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .statcol .v{font-size:20px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .statcol .l{font-size:11.5px;color:var(--text2)}
  .kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:0 0 auto} /* pay-group color key: the summary rows match the composition bar */
  .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .press{transition:transform .12s ease}.press:active{transform:scale(.97)}
  @keyframes tilePop{0%{transform:scale(.62)}58%{transform:scale(1.06)}} /* no 100% frame: the pop lands on the cell's own scale (1.06 when selected), so it never snaps at the end */
  button:focus-visible,[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

  .hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(150deg,#6D4E8C,#3B2456 78%);border:1px solid rgba(255,255,255,.14);touch-action:pan-y}
  .hero::after{content:"";position:absolute;top:-40%;right:-10%;width:70%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
  .hero .k{font-size:12px;font-weight:600;color:rgba(233,224,247,.85);letter-spacing:.3px}
  .hero .v{font-size:38px;font-weight:800;letter-spacing:-1px;margin:6px 0 3px;font-variant-numeric:tabular-nums}
  .hero .s{font-size:12.5px;color:rgba(255,255,255,.72)}

  .brk{display:flex;align-items:center;gap:12px;padding:13px 15px}
  .brk .bd{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brk .bd svg{width:16px;height:16px;color:#fff}
  .brk .nm{font-size:14px;font-weight:600}.brk .sub{font-size:11.5px;color:var(--text2)}
  .brk .amt{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .compbar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--fill)}
  .compbar i{height:100%;display:block}
  .histchart{display:flex;gap:7px;align-items:flex-end}
  .histbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
  .hbtrack{width:100%;max-width:30px;height:76px;display:flex;align-items:flex-end}
  .hbfill{width:100%;border-radius:7px;background:var(--fill);min-height:4px;transition:background .2s}
  .histbar.on .hbfill{background:var(--accent)}
  .hblbl{font-size:10.5px;color:var(--text2)}
  .histbar.on .hblbl{color:var(--text);font-weight:700}

  /* Calendar */
  .navbtn{width:34px;height:34px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text)}
  .navbtn svg{width:16px;height:16px}
  .editbtn{padding:8px 15px;border-radius:11px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
  .editbtn.on{color:#fff;background:var(--accent)}
  .brushbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .brushbar::-webkit-scrollbar{display:none}
  .brush{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);font-size:13px;font-weight:600;transition:.15s}
  .brush.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
  .brush .sw{width:14px;height:14px;border-radius:5px}
  .weekhdr,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .weekhdr span{text-align:center;font-size:11px;font-weight:700;color:var(--text3)}
  .weekhdr span.we{color:var(--accent)}
  .cell{height:46px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
  .cell .circ{width:37px;height:37px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;transition:transform .18s cubic-bezier(.3,1.3,.5,1),background .15s}
  .cell.work .circ{color:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
  .cell.today .circ{outline:2px solid var(--accent);outline-offset:2px;font-weight:800}
  .cell.sel .circ{transform:scale(1.06)}
  .cell.sel .circ::after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2.5px solid var(--accent)}
  .cell.dim{opacity:.32}
  .cell.pp .circ{transform:scale(.85)}
  .cell .ot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:2px;background:var(--gold);z-index:2}
  .cell .hol{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red);z-index:2}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600}
  .mix{display:flex;flex-wrap:wrap;gap:8px}
  .mixchip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;background:var(--fill);font-size:12.5px;font-weight:600}
  .mixchip .ct{color:var(--text2)}

  .listrow{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left;transition:background .16s}
  .listrow:active{background:var(--fill)}
  .toggle{width:50px;height:30px;border-radius:15px;background:var(--fill2);position:relative;transition:.2s;flex:0 0 auto}
  .toggle.on{background:var(--accent)}
  .toggle i{position:absolute;top:2.5px;left:2.5px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
  .toggle.on i{transform:translateX(20px)}
  .field{display:flex;align-items:center;gap:10px;padding:6px 14px}
  .field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 0;outline:none;font-family:inherit}
  .field .cur{font-size:14px;font-weight:600;color:var(--text2)}
  .tinput{width:100%;background:var(--fill);border:1px solid var(--card-border);border-radius:11px;color:var(--text);font-size:15px;padding:12px 14px;outline:none;font-family:inherit}
  .tinput:focus{border-color:var(--accent)}

  .tabbar{position:fixed;left:20px;right:20px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;z-index:7;display:flex;gap:4px;padding:0 8px;align-items:center;background:var(--tabbar);border:1px solid var(--tab-border);border-radius:33px;backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 20px 40px -18px rgba(30,10,50,.5)}
  .tabbtn{position:relative;flex:1;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text2);z-index:1;transition:color .34s cubic-bezier(.3,1.1,.35,1)} /* same curve as .tabhi: the label changes colour while the pill travels, not before it arrives */
  .tabbtn svg{width:20px;height:20px}.tabbtn span{font-size:9.5px;font-weight:500}
  .tabbtn.on{color:#fff}.tabbtn.on span{font-weight:600}
  .tabhi{position:absolute;top:7px;height:52px;border-radius:26px;background:var(--accent);box-shadow:0 6px 16px -5px var(--accent);z-index:0;transition:transform .34s cubic-bezier(.3,1.1,.35,1),width .34s cubic-bezier(.3,1.1,.35,1)}

  .backdrop{position:absolute;inset:0;z-index:20;background:rgba(10,5,20,0);pointer-events:none;transition:background .3s ease} /* dim only — no backdrop blur: animating its radius re-rasterised the whole screen on every open/close */
  .backdrop.show{background:rgba(10,5,20,.42);pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card2);border-radius:26px 26px 0 0;border-top:1px solid var(--card-border);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:min(93%, calc(100% - env(safe-area-inset-top,0px) - 12px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;transform:translateY(103%);box-shadow:0 -12px 44px rgba(20,8,40,.4)}
  .sheet.show{transform:translateY(0)} /* the resting OPEN position — static, so it never depends on an animation and never flashes to the hidden base when the drag toggles animations */
  .sheet.opening{animation:sheetIn .42s cubic-bezier(.2,1,.32,1)} /* one-shot entrance; a separate class so toggling .grab can't replay it (removed shortly after open) */
  .sheet.hide{animation:sheetOut .26s ease forwards}
  .sheet.grab{animation:none!important} /* while dragging: inline transform takes over (native scroll is blocked by the #sheet touchmove listener — touch-action can't change mid-gesture) */
  .sheet.dragging{will-change:transform} /* keep the blur — promote to its own layer so the translate stays buttery. Smoothness comes from NOT repainting the backdrop each frame (see sdFrame), not from dropping blur */
  @keyframes sheetIn{from{transform:translateY(103%)}to{transform:translateY(0)}}
  @keyframes sheetOut{from{transform:translateY(0)}to{transform:translateY(103%)}}
  .sheet::-webkit-scrollbar{width:0}
  .sheet .inner{opacity:0;transform:scale(.96);animation:innerIn .4s .06s cubic-bezier(.2,1,.32,1) forwards}
  @keyframes innerIn{to{opacity:1;transform:scale(1)}}
  /* Directional slide when navigating between settings sub-sheets (forward=deeper, back=return) */
  .sheet .inner.sheet-f{animation:sheetInF .28s cubic-bezier(.2,.9,.3,1) both}
  .sheet .inner.sheet-b{animation:sheetInB .28s cubic-bezier(.2,.9,.3,1) both}
  @keyframes sheetInF{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  @keyframes sheetInB{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.sheet .inner.sheet-f,.sheet .inner.sheet-b{animation:none!important}.sheet .inner{opacity:1;transform:none}}
  .handle{width:38px;height:5px;border-radius:3px;background:var(--divider);margin:8px auto 16px}
  .sheethdr{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:16px}
  .sheethdr .t{font-size:16px;font-weight:700;position:absolute;left:50%;transform:translateX(-50%);max-width:56%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .link{color:var(--accent);font-size:16px;font-weight:500}.link.b{font-weight:700}
  .optrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;transition:background .18s}
  .optrow.on{background:var(--accent-soft)}
  .check{color:var(--accent);display:flex}.check svg{width:18px;height:18px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:30px;height:30px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .stepper button:active{transform:scale(.88)}.stepper button svg{width:12px;height:12px}
  .stepper .sv{min-width:58px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

  /* Color picker */
  .cpick{padding:14px;display:flex;flex-direction:column;gap:12px}
  .sv{position:relative;width:100%;height:150px;border-radius:12px;cursor:crosshair;touch-action:none;border:1px solid var(--card-border)}
  .sv-th{position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .hue{position:relative;width:100%;height:16px;border-radius:8px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .hue-th{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .cprow{display:flex;align-items:center;gap:10px}
  .cprev{width:38px;height:38px;border-radius:10px;flex:0 0 auto;border:1px solid var(--card-border)}
  .hexin{flex:1;background:var(--fill);border:1px solid var(--card-border);border-radius:10px;color:var(--text);font-size:15px;font-weight:600;padding:11px 12px;outline:none;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .pcol{width:28px;height:28px;border-radius:8px;position:relative}
  .pcol.on::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:2px solid var(--accent)}
  .iconrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .icb{width:42px;height:42px;border-radius:11px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text2)}
  .icb svg{width:20px;height:20px}
  .icb.on{background:var(--accent);color:#fff}
  .delbtn{width:100%;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red);font-weight:600;font-size:15px;margin-top:14px;transition:transform .12s}
  .delbtn:active{transform:scale(.98)}

  .preview{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden}
  .preview::after{content:"";position:absolute;top:-30%;right:-10%;width:60%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 60%)}
  .preview .hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:1}
  .preview .hd .ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}

  :root{ --page-bg:#ECECEA; --page-fg:#1A1A1E; --bezel:#0b0b0d; }

  return[Math.round((r+mm)*255),Math.round((g+mm)*255),Math.round((b+mm)*255)];}
function hex2(v){return v.toString(16).padStart(2,'0');}

function saveState(){_mtCache={};try{const o={};SK.forEach(k=>o[k]=state[k]);localStorage.setItem('shifthub_v4',JSON.stringify(o));}catch(e){toast(tr('Could not save on this device'));} syncReminders();}
// Everything read from storage or a backup passes through here: a wrong type or out-of-range value falls back to its default
// (a malformed backup used to be saved as-is and break the render on every launch). Also applies the old-format migrations.
function normalize(o){ o=o&&typeof o==='object'?o:{}; const D=JSON.parse(JSON.stringify(DEFAULTS)), n={};
  const obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v), ID=/^[\w-]{1,40}$/, ISO=/^\d{4}-\d{2}-\d{2}$/;
  const num=(v,lo,hi,d)=>{ if(typeof v==='string'&&v.trim()!=='') v=+v; return typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi?v:d; };
  const str=(v,max)=>typeof v==='string'?v.slice(0,max):'';
  const S=obj(o.salary)?o.salary:{};
  n.salary={net:num(S.net,0,1e9,num(obj(o.salary)?undefined:o.netMonthly,0,1e9,D.salary.net))}; // netMonthly: pre-v4 format
  ['overtime','night','weekend','holiday'].forEach(k=>{ const b=obj(S[k])?S[k]:{}; n.salary[k]={on:typeof b.on==='boolean'?b.on:D.salary[k].on,pct:num(b.pct,0,300,D.salary[k].pct)}; });
  n.salary.additions=(Array.isArray(S.additions)?S.additions:[]).filter(a=>obj(a)&&ID.test(a.id)&&num(a.amount,0.01,1e9,0)).map(a=>{
    const f=['monthly','weekly','annual','once'].includes(a.freq)?a.freq:'monthly', r={id:a.id,name:str(a.name,100),amount:+a.amount,freq:f,on:a.on!==false};
    if(f==='annual'||f==='once') r.month=num(a.month,1,12,12); if(f==='once') r.year=num(a.year,1970,2200,TODAY.getFullYear()); return r; });
  n.shifts=Array.isArray(o.shifts)?o.shifts.filter(x=>obj(x)&&ID.test(x.id)).map(x=>{ const r={id:x.id,name:str(x.name,100)||'Shift',start:num(x.start,0,1439,540),end:num(x.end,0,1439,1020),
    brk:num(x.brk,0,180,0),color:/^#[0-9a-f]{6}$/i.test(x.color)?x.color:'#6366F1',icon:SHIFT_ICONS.includes(x.icon)?x.icon:'briefcase',night:x.night===true}; if(x.vac===true) r.vac=true; const nm=num(x.nightMin,0,1440,null); if(nm!==null) r.nightMin=nm; return r; }):D.shifts;
  if(!n.shifts.some(x=>x.vac)) n.shifts.push({id:'hol',name:'Paid leave',start:540,end:1020,brk:0,color:'#EC5A99',icon:'coffee',night:false,vac:true}); // older saves had no paid-leave shift
  const OLDC={m:'#9B7FB8',a:'#5E8F88',n:'#4B4E8C',hol:'#3E9E8C'},NEWC={m:'#F2A63C',a:'#14B8A6',n:'#6366F1',hol:'#EC5A99'}; // old default palette → current (only if untouched)
  n.shifts.forEach(x=>{ if(OLDC[x.id]&&x.color.toUpperCase()===OLDC[x.id]) x.color=NEWC[x.id];
    if(x.id==='hol'&&x.vac&&x.name==='Holiday'){ x.name='Paid leave'; if(['#22C08A','#3E9E8C'].includes(x.color.toUpperCase())) x.color='#EC5A99'; } });
  const ids=new Set(n.shifts.map(x=>x.id)); n.assignments={}; n.dayMeta={};
  if(obj(o.assignments)) for(const k in o.assignments) if(ISO.test(k)&&ids.has(o.assignments[k])) n.assignments[k]=o.assignments[k]; // drop days pointing at missing shifts
  if(obj(o.dayMeta)) for(const k in o.dayMeta){ const m=o.dayMeta[k]; if(!ISO.test(k)||!obj(m)) continue;
    const v={otDay:num(m.otDay,0,16,0),otNight:num(m.otNight,0,16,0),holiday:m.holiday===true}; if(v.otDay||v.otNight||v.holiday) n.dayMeta[k]=v; }
  const R=obj(o.region)?o.region:{}, DR=D.region;
  n.region={country:COUNTRIES[R.country]?R.country:DR.country, currency:/^[A-Z]{3}$/.test(R.currency)?R.currency:DR.currency,
    locale:NUMFMTS.some(f=>f[0]===R.locale)?R.locale:DR.locale,
    weekendDays:Array.isArray(R.weekendDays)?[...new Set(R.weekendDays.filter(d=>Number.isInteger(d)&&d>=0&&d<=6))].sort((a,b)=>a-b):DR.weekendDays,
    weekStart:[0,1,6].includes(R.weekStart)?R.weekStart:DR.weekStart, stdHours:num(R.stdHours,1,24,DR.stdHours),
    customHolidays:(Array.isArray(R.customHolidays)?R.customHolidays:[]).filter(obj).map(h=>({m:num(h.m,1,12,0),d:num(h.d,1,31,0),name:str(h.name,100)})).filter(h=>h.m&&h.d)};
  n.appearance=['light','dark','auto'].includes(o.appearance)?o.appearance:D.appearance;
  n.reminders=o.reminders===true; // the old `notifications` flag never scheduled anything — it is not consent
  n.onboarded=true; // saved data or a backup means a returning user — never show onboarding
  n.lang=LANGS.some(l=>l[0]===o.lang)?o.lang:D.lang;

  return n; }
function loadState(){ let o; try{ o=JSON.parse(localStorage.getItem('shifthub_v4')); }catch(e){ return; } if(!o) return;
  const n=normalize(o); SK.forEach(k=>state[k]=n[k]); clearHolidayCache(); }

/* ===== Backup & restore (full state as versioned JSON) ===== */
function exportBackup(){const data={};SK.forEach(k=>data[k]=state[k]);
  return JSON.stringify({app:'shifthub',v:4,exportedAt:new Date().toISOString(),data},null,2);}
function relBackup(ts){ // localized "x ago" via the browser Intl API — keeps all six languages correct with no new strings
  try{ const s=(ts-Date.now())/1000, rtf=new Intl.RelativeTimeFormat(state.lang||'en',{numeric:'auto'});
    const U=[['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60]];
    for(const [u,n] of U){ if(Math.abs(s)>=n) return rtf.format(Math.round(s/n),u); }
    return rtf.format(Math.round(s),'second');
  }catch(e){ return new Date(ts).toLocaleDateString(state.lang||'en'); }
}
function markBackup(){ state.lastBackupAt=Date.now(); state.hubDirty=true; saveState(); if(state.sheet==='backup') renderSheetUpdate(); } // record the moment data left the device
function copyBackup(){const t=exportBackup();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>{markBackup();toast(tr('Backup copied'));}).catch(()=>toast(tr('Copy blocked here')));else toast(tr('Copy blocked here'));}
async function downloadBackup(){const t=exportBackup();
  const fname='shifthub-backup-'+isoOf(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())+'.json';
  // Expo WebView: <a download> + blob is unreliable on iOS WKWebView (it ends up saving the page HTML, not our JSON) — hand the backup to the native layer, which opens the iOS share sheet (Save to Files / Mail / AirDrop) with exactly this JSON.
  if(window.ReactNativeWebView&&window.ReactNativeWebView.postMessage){
    window.ReactNativeWebView.postMessage('backup:'+fname+'\n'+t);
    markBackup();toast(tr('Backup ready'));return;
  }
  // Claude artifact runtime: browser downloads are blocked, use the downloads capability
  if(window.claude&&typeof claude.use==='function'){
    try{const dl=await claude.use('downloads');
      if(dl){await dl.save({filename:fname,data:t});markBackup();toast(tr('Backup saved'));return;}
    }catch(e){ if(e&&e.code==='declined')return; }
  }
  // Standalone / installed PWA: native file download
  try{const blob=new Blob([t],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);markBackup();toast(tr('Backup downloaded'));
  }catch(e){copyBackup();}}
function applyBackup(obj){ // replaces EVERYTHING: keys missing from the backup return to defaults instead of mixing with the current data
  try{ localStorage.setItem('shifthub_v4_prev', localStorage.getItem('shifthub_v4')||''); }catch(e){} // one-step safety copy of what is being replaced
  const n=normalize(obj.data); SK.forEach(k=>state[k]=n[k]);
  try{ document.documentElement.lang=state.lang; }catch(e){}
  clearHolidayCache(); closeSheet(); saveState(); renderAll(); }
function restoreFromText(text){
  if(!text||!text.trim()){toast(tr('Paste a backup or pick a file'));return;}
  let obj;try{obj=JSON.parse(text);}catch(e){toast(tr('Invalid backup file'));return;}
  if(!obj||obj.app!=='shifthub'||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data)||!SK.concat('netMonthly').some(k=>k in obj.data)){toast(tr('Not a ShiftHub backup'));return;} // netMonthly: pre-v4 format
  if(obj.v>4){toast(tr('This backup was made by a newer version of Shift Hub'));return;} // never half-apply a format this build doesn't know
  confirmDialog(tr('Restore backup?'),tr('This replaces all current shifts, salary and calendar data on this device. This cannot be undone.'),tr('Restore'),()=>{applyBackup(obj);toast(tr('Backup restored'));});}

/* ===== Color picker interactions ===== */
function updatePickerUI(){
  const col=draftColor();
  const sv=document.getElementById('cpsv'),svT=document.getElementById('cpsvT'),hueT=document.getElementById('cphueT'),prev=document.getElementById('cprev'),hex=document.getElementById('cphex');
  if(!sv)return;
  sv.style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(state.pk.h,1,1)})`;
  svT.style.left=(state.pk.s*100)+'%';svT.style.top=((1-state.pk.v)*100)+'%';
  hueT.style.left=(state.pk.h/360*100)+'%';
  prev.style.background=col; if(document.activeElement!==hex) hex.value=col;
  const sp=document.querySelector('.preview'); if(sp)sp.style.background=col;
  document.querySelectorAll('.pcol').forEach(p=>p.classList.toggle('on', (p.getAttribute('data-action')||'').split(':')[1]?.toLowerCase()===col.toLowerCase()));
}
function attachPicker(){
  const sv=document.getElementById('cpsv'),hue=document.getElementById('cphue'),hex=document.getElementById('cphex');
  if(!sv)return;
  const svMove=e=>{const r=sv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    x=Math.max(0,Math.min(1,x));y=Math.max(0,Math.min(1,y));state.pk.s=x;state.pk.v=1-y;updatePickerUI();};
  const hueMove=e=>{const r=hue.getBoundingClientRect();let x=(e.clientX-r.left)/r.width;x=Math.max(0,Math.min(1,x));state.pk.h=x*360;updatePickerUI();};
  bindDrag(sv,svMove); bindDrag(hue,hueMove);
  hex.addEventListener('input',()=>{const hv=hexToHsv(hex.value.trim());if(hv){state.pk=hv;updatePickerUI();}});
}
function bindDrag(el,move){
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);move(e);e.preventDefault();
    const mv=ev=>move(ev),up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);});
}

/* ===== Paint ===== */
let painting=false;
function applyBrush(cell){const iso=cell.getAttribute('data-iso');if(!iso)return;
  const want=state.brush==='off'?undefined:state.brush;
  const changed=state.assignments[iso]!==want; // only pop when the assignment actually changes (avoids re-pop while dragging over the same cell)
  if(state.brush==='off')delete state.assignments[iso];else state.assignments[iso]=state.brush;
  paintCellVisual(cell,iso,changed);
  state.selISO=iso; moveRing(cell);}  // selection ring follows the cell being painted
function paintCellVisual(cell,iso,pop){const s=assignedShift(iso);const circ=cell.querySelector('.circ');const hol=isHolISO(iso);
  if(s){cell.classList.add('work');circ.style.background=s.color;circ.style.color='#fff';
    if(pop&&!reduce){circ.style.animation='none';void circ.offsetWidth;circ.style.animation=POP;}}
  else{cell.classList.remove('work');circ.style.background='var(--fill)';circ.style.color=hol?'var(--red)':'var(--text2)';}}
function moveRing(cell){ // instant reposition (no spring) so the ring tracks the finger while painting
  const grid=document.getElementById('calgrid'); if(!grid) return;
  let ring=grid.querySelector('.calsel');
  if(!ring){ ring=document.createElement('div'); ring.className='calsel'; grid.appendChild(ring); }
  const x=cell.offsetLeft,y=cell.offsetTop;
  ring.style.width=cell.offsetWidth+'px'; ring.style.height=cell.offsetHeight+'px'; ring.style.transform=`translate(${x}px,${y}px)`;
  ringPrev={x,y};}
const POP='tilePop .28s cubic-bezier(.34,1.4,.5,1)';
function afterPaint(){state.hubDirty=true;saveState();
  // the full render replaces the cells: carry each running pop onto the new cell at the same point, then drop the inline style so the DOM settles to the normal render
  const pops=[...document.querySelectorAll('#calgrid .circ')].flatMap(c=>c.getAnimations?c.getAnimations().filter(a=>a.animationName==='tilePop'&&a.playState==='running').map(a=>[c.closest('.cell').dataset.iso,a.currentTime]):[]);
  renderScreen();
  for(const [iso,t] of pops){const c=document.querySelector(`#calgrid .cell[data-iso="${iso}"] .circ`);if(!c)continue;
    const css=c.getAttribute('style');c.style.animation=POP;const a=c.getAnimations().find(a=>a.animationName==='tilePop');if(a)a.currentTime=t;
    c.addEventListener('animationend',()=>c.setAttribute('style',css),{once:true});}}

/* ===== Sheets openers ===== */
function openDayMeta(){const m=metaOf(state.selISO);state.draftOtDay=m.otDay;state.draftOtNight=m.otNight;state.draftHoliday=!!(state.dayMeta[state.selISO]&&state.dayMeta[state.selISO].holiday);state.sheet='meta';renderSheet();}
function saveMeta(){const iso=state.selISO;const has=state.draftOtDay>0||state.draftOtNight>0||state.draftHoliday;
  if(has)state.dayMeta[iso]={otDay:state.draftOtDay,otNight:state.draftOtNight,holiday:state.draftHoliday};else delete state.dayMeta[iso];
  state.hubDirty=true;saveState();closeSheet();renderScreen();hap(10);toast(tr('Day saved'));}
function openShift(id){const s=shiftById(id);state.editingId=id;state.isNew=false;state.d={name:s.name,start:s.start,end:s.end,brk:s.brk,color:s.color,icon:s.icon,night:s.night,vac:!!s.vac,nightMin:s.nightMin};
  state.pk=hexToHsv(s.color)||{h:0,s:0,v:.6};state.sheet='shift';renderSheet();}
function openNewShift(){state.editingId=null;state.isNew=true;state.d={name:'',start:540,end:1020,brk:60,color:'#6366F1',icon:'briefcase',night:false,vac:false};
  state.pk=hexToHsv('#6366F1');state.sheet='shift';renderSheet();}
function saveShift(){const nameEl=document.getElementById('shname');if(nameEl)state.d.name=nameEl.value.trim();
  state.d.color=draftColor(); if(!state.d.name)state.d.name='Shift';
  if(state.isNew){const id='c'+Date.now();state.shifts.push({id,...state.d});}
  else{const s=shiftById(state.editingId);Object.assign(s,state.d);if(s.nightMin===undefined)delete s.nightMin;}
  state.hubDirty=true;saveState();closeSheet();renderScreen();hap(12);toast(state.isNew?tr('Shift created'):tr('Shift updated'));}
function removeShift(id){ state.shifts=state.shifts.filter(s=>s.id!==id);
  Object.keys(state.assignments).forEach(iso=>{if(state.assignments[iso]===id)delete state.assignments[iso];});
  if(state.brush===id)state.brush=state.shifts[0]?state.shifts[0].id:'off';
  state.hubDirty=true;saveState(); }
function deleteShift(){ const id=state.editingId; closeSheet(); animateDeleteShift(id); hap(18); toast(tr('Shift deleted')); } // the row collapses behind the closing sheet, like swipe-delete
function closeSheet(){if(!state.sheet)return; // already closing (e.g. the dim tapped while a swiped-away sheet slides out): let that exit finish
  const sh=document.getElementById('sheet'),bd=document.getElementById('backdrop');clearTimeout(sh._sb);
  if(sh.contains(document.activeElement))document.activeElement.blur(); // a field left focused in a hidden sheet keeps the iOS keyboard up
  if(sh.classList.contains('opening')&&!reduce){ clearTimeout(sh._openT); const y=sheetY(sh); sh.classList.remove('opening'); sh.classList.add('grab'); sh.style.transition='none'; sh.style.transform='translateY('+y+'px)'; void sh.offsetWidth; } // closed mid-entrance: leave from where it is, via the grab path
  if(sh.classList.contains('grab')){ // sheet was dragged — dismiss via inline transform (animation is disabled by .grab)
    const dur=reduce?0:0.3;
    sh.style.transition='transform '+dur+'s cubic-bezier(.32,.72,0,1)';sh.style.transform='translateY(103%)';
    sh._sb=setTimeout(()=>{sh.classList.remove('grab','dragging','show');sh.style.transition='';sh.style.transform='';},dur*1000+40);
  } else if(state.sheet&&!reduce){sh.classList.remove('show');sh.classList.add('hide');}
  else sh.classList.remove('show');
  bd.classList.remove('show');state.sheet=null;}
function changeMonth(delta){const was=state.tab==='hub'?monthTotals(state.viewY,state.viewM).grand:null;let m=state.viewM+delta,y=state.viewY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}state.viewM=m;state.viewY=y;
  const n=new Date(y,m+1,0).getDate();const [,,sd]=state.selISO.split('-').map(Number);state.selISO=isoOf(y,m,Math.min(sd,n));
  ringPrev=null; gridSlide=delta>0?'slideR':'slideL'; renderScreen(); gridSlide=''; hap(6);
  const h=was!==null&&document.querySelector('.hero [data-count]'); if(h) countUp(h,h.dataset.count,360,Math.round(was));} // HUB: the pay counts from the month left to the new one

/* ===== Shifts swipe-to-delete ===== */
let suppressClick=false, sw=null; // suppressClick swallows the phantom click that follows a gesture's pointerup
document.addEventListener('pointerdown',()=>{suppressClick=false;},{capture:true,passive:true}); // …and a new gesture ends that window (no timers: they ate the next real tap)
document.addEventListener('pointerdown',e=>{
  if(state.tab!=='shifts'||state.sheet)return;
  const front=e.target.closest?e.target.closest('.swipe .front'):null; if(!front)return;
  const el=front.parentElement; if(!el.querySelector('.del'))return; // nothing to reveal (last paid-leave shift)
  sw={el,front,x:e.clientX,y:e.clientY,moved:false,open:el.classList.contains('open'),t:0};
});
document.addEventListener('pointermove',e=>{
  if(!sw)return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.moved){ if(Math.abs(dx)<6&&Math.abs(dy)<6)return; if(Math.abs(dy)>Math.abs(dx)){sw=null;return;} sw.moved=true; }
  const t=Math.max(-76,Math.min(0,(sw.open?-76:0)+dx));
  sw.front.style.transition='none'; sw.front.style.transform=`translateX(${t}px)`; sw.t=t;
});
document.addEventListener('pointerup',()=>{
  if(!sw)return; const s=sw; sw=null; s.front.style.transition='';
  if(!s.moved){ if(s.open){ s.el.classList.remove('open'); s.front.style.transform=''; suppressClick=true; } else s.front.style.transform=''; return; }
  if(s.t<-44){ s.el.classList.add('open'); } else { s.el.classList.remove('open'); }
  s.front.style.transform=''; suppressClick=true;
});

function moveShift(id,d){ const i=state.shifts.findIndex(s=>s.id===id), j=i+d; if(i<0||j<0||j>=state.shifts.length)return;
  state.shifts.splice(j,0,state.shifts.splice(i,1)[0]); saveState(); renderScreen();
  const b=document.querySelector(`[data-action="${d<0?'shiftUp':'shiftDown'}:${id}"]`)||document.querySelector(`.srbtn[data-action$=":${id}"]`); if(b)b.focus(); } // the screen reader stays on the moved shift
/* ===== Shifts reorder: hold a row ~450 ms (like the calendar long-press), then drag it up or down ===== */
let ro=null;
document.addEventListener('pointerdown',e=>{
  if(state.tab!=='shifts'||state.sheet||!e.target.closest)return;
  const row=e.target.closest('#shiftlist .swipe'); if(!row||row.classList.contains('open'))return;

    /* additional (non-shift) earnings */
    case 'openBonuses': state.bonusFrom=(state.sheet==='salary'?'salary':'settings'); state.bonusDraft={name:'',amount:'',freq:'monthly',month:12,year:TODAY.getFullYear()};state.bonusEditId=null;state.sheet='bonuses';state.sheetDir='f';renderSheetUpdate(); break;
    case 'backSalary': state.sheet='salary';state.sheetDir='b';renderSheetUpdate(); break;
    case 'bfreq': syncBonusDraft();state.bonusDraft.freq=arg;renderSheetUpdate(); break;
    case 'bMm': syncBonusDraft();state.bonusDraft.month=((state.bonusDraft.month-2+12)%12)+1;renderSheetUpdate(); break;
    case 'bMp': syncBonusDraft();state.bonusDraft.month=(state.bonusDraft.month%12)+1;renderSheetUpdate(); break;
    case 'bYm': syncBonusDraft();state.bonusDraft.year=Math.max(2000,state.bonusDraft.year-1);renderSheetUpdate(); break;
    case 'bYp': syncBonusDraft();state.bonusDraft.year=Math.min(2100,state.bonusDraft.year+1);renderSheetUpdate(); break;
    case 'bonusEdit': { const a=(state.salary.additions||[]).find(x=>x.id===arg); if(a){ state.bonusEditId=arg; state.bonusDraft={name:a.name||'',amount:a.amount,freq:a.freq||'monthly',month:a.month||12,year:a.year||TODAY.getFullYear()}; renderSheetUpdate(); } } break;
    case 'bonusCancelEdit': state.bonusDraft={name:'',amount:'',freq:'monthly',month:12,year:TODAY.getFullYear()};state.bonusEditId=null;renderSheetUpdate(); break;
    case 'bonusDel': syncBonusDraft(); state.salary.additions=(state.salary.additions||[]).filter(x=>x.id!==arg); if(state.bonusEditId===arg){state.bonusEditId=null;state.bonusDraft={name:'',amount:'',freq:'monthly',month:12,year:TODAY.getFullYear()};} state.hubDirty=true;saveState();renderSheetUpdate();hap(6); break;
    case 'bonusTog': { syncBonusDraft(); const a=(state.salary.additions||[]).find(x=>x.id===arg); if(a){ a.on=(a.on===false); state.hubDirty=true;saveState();renderSheetUpdate();hap(6); } } break;
    case 'bonusSave': { syncBonusDraft(); const D=state.bonusDraft, amt=parseFloat(D.amount); const nm=(D.name||'').trim();
      if(!nm||isNaN(amt)||amt<=0){ hap(6); toast(tr('Enter a name and an amount')); break; }
      const rec={name:nm,amount:amt,freq:D.freq,month:D.month,year:D.year,on:true};
      if(!(D.freq==='annual'||D.freq==='once')) delete rec.month; if(D.freq!=='once') delete rec.year;
      if(state.bonusEditId){ const a=(state.salary.additions||[]).find(x=>x.id===state.bonusEditId); if(a)Object.assign(a,rec,{on:a.on!==false}); }
      else { (state.salary.additions=state.salary.additions||[]).push(Object.assign({id:'b'+Date.now().toString(36)},rec)); }
      state.bonusEditId=null;state.bonusDraft={name:'',amount:'',freq:'monthly',month:12,year:TODAY.getFullYear()};
      state.hubDirty=true;saveState();renderSheetUpdate();hap(10); } break;
    case 'sheetClose': closeSheet(); if(state.hubDirty) renderScreen(); break;
    case 'addShift': openNewShift(); break;
    case 'editShift': openShift(arg); break;
    case 'shiftUp': case 'shiftDown': moveShift(arg,cmd==='shiftUp'?-1:1); break;
    case 'delSwipe': { const s=shiftById(arg); confirmDialog(tr('Delete shift?'), (s?s.name:tr('This shift'))+' '+tr('will be removed and any days using it set to Off.'), tr('Delete'), ()=>animateDeleteShift(arg)); } break;
    /* meta sheet */
    case 'otDayM': state.draftOtDay=Math.max(0,state.draftOtDay-1);renderSheetUpdate(); break;
    case 'otDayP': state.draftOtDay=Math.min(16,state.draftOtDay+1);renderSheetUpdate(); break;
    case 'otNightM': state.draftOtNight=Math.max(0,state.draftOtNight-1);renderSheetUpdate(); break;
    case 'otNightP': state.draftOtNight=Math.min(16,state.draftOtNight+1);renderSheetUpdate(); break;
    case 'holToggle': state.draftHoliday=!state.draftHoliday;renderSheetUpdate(); break;
    case 'metaSave': saveMeta(); break;
    /* shift sheet */
    case 'sM': state.d.start=(state.d.start-30+1440)%1440;refreshShiftSheet(); break;
    case 'sP': state.d.start=(state.d.start+30)%1440;refreshShiftSheet(); break;
    case 'eM': state.d.end=(state.d.end-30+1440)%1440;refreshShiftSheet(); break;
    case 'eP': state.d.end=(state.d.end+30)%1440;refreshShiftSheet(); break;
    case 'bM': state.d.brk=Math.max(0,state.d.brk-5);refreshShiftSheet(); break;
    case 'bP': state.d.brk=Math.min(180,state.d.brk+5);refreshShiftSheet(); break;
    case 'shNight': state.d.night=!state.d.night;refreshShiftSheet(); break;
    case 'nhM': case 'nhP': { const p=paidMinutes(state.d), v=Math.max(30,Math.min(p,Math.min(state.d.nightMin??p,p)+(cmd==='nhP'?30:-30))); state.d.nightMin=v>=p?undefined:v; refreshShiftSheet(); } break; // whole shift = unset, so it follows later schedule changes
    case 'shVac': state.d.vac=!state.d.vac; if(state.d.vac){state.d.brk=0;state.d.night=false;} refreshShiftSheet(); break;
    case 'vacHM': { let dur=((state.d.end-state.d.start+1440)%1440)||1440; dur=Math.max(30,dur-30); state.d.end=(state.d.start+dur)%1440; refreshShiftSheet(); } break;
    case 'vacHP': { let dur=((state.d.end-state.d.start+1440)%1440)||1440; dur=Math.min(1440,dur+30); state.d.end=(state.d.start+dur)%1440; refreshShiftSheet(); } break;
    case 'shIcon': state.d.icon=arg;refreshShiftSheet(); break;
    case 'preset': state.pk=hexToHsv(arg);updatePickerUI(); break;
    case 'shiftSave': saveShift(); break;
    case 'shiftDelete': deleteShift(); break;
    /* export */
    case 'csvCopy': {const txt=csvExport(state.viewY,state.viewM);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(tr('CSV copied'))).catch(()=>toast(tr('Copy blocked here')));else toast(tr('Copy blocked here'));} break;
  }
});
// Re-render the shift sheet but keep the name field value & focus
function refreshShiftSheet(){const nameEl=document.getElementById('shname');if(nameEl)state.d.name=nameEl.value;renderSheetUpdate();}
window.addEventListener('resize',()=>{moveTabHi();});


document.addEventListener('visibilitychange',refreshToday); window.addEventListener('focus',refreshToday);
function refreshToday(){ if(document.hidden) return; syncReminders(); const n=new Date(); if(n.toDateString()===TODAY.toDateString()) return;
  TODAY=n; if(!state.sheet){ state.viewY=n.getFullYear(); state.viewM=n.getMonth(); state.selISO=isoOf(state.viewY,state.viewM,n.getDate()); } ringPrev=null; renderScreen(); } // new day: today ring, upcoming card, current month — an open sheet keeps its day (the day sheet saves to selISO)

loadState();
if(!state.onboarded){ state.onbStep=0; state.onbCountry=''; state.lang=detectLang(); state.salary.net=0; } // no country preselected — the user must choose (salary rules, currency, holidays depend on it)
try{ document.documentElement.lang=state.lang||'en'; }catch(e){}
renderAll();
</script>
